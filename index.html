<body class="theme-dark min-h-screen text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback, useMemo, createContext, useContext, useReducer } = React;

    // ============================================
    // ENHANCED CONSTANTS & HELPERS
    // ============================================
    const GIST_FILENAME = 'jacobs-timetracker-data-v3.json';
    const DAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
    const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    const THEMES = {
      dark: { name: 'Dark', bg: 'theme-dark', accent: 'cyan' },
      midnight: { name: 'Midnight Blue', bg: 'theme-midnight', accent: 'blue' },
      forest: { name: 'Forest Green', bg: 'theme-forest', accent: 'emerald' },
      amber: { name: 'Warm Amber', bg: 'theme-amber', accent: 'amber' },
    };
    const TAG_PRESETS = ['fieldwork','office','review','meeting','design','site','billable','nonbillable'];
    const TARGET_HOURS = 40;
    
    // Pay period types
    const PAY_PERIOD_TYPES = {
      weekly: { name: 'Weekly', days: 7 },
      biweekly: { name: 'Bi-Weekly', days: 14 },
      semimonthly: { name: 'Semi-Monthly', days: 15 },
    };

    const fmt = (d) => d.toISOString().split('T')[0];
    const today = () => fmt(new Date());
    const parseDate = (s) => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };

    const getWeekDates = (refDate) => {
      const d = refDate ? new Date(refDate) : new Date();
      const day = d.getDay();
      const mon = new Date(d);
      mon.setDate(d.getDate() - (day === 0 ? 6 : day - 1));
      mon.setHours(0,0,0,0);
      return Array.from({length:7}, (_,i) => {
        const dt = new Date(mon);
        dt.setDate(mon.getDate()+i);
        return fmt(dt);
      });
    };

    const getPayPeriodDates = (refDate, type = 'weekly') => {
      const d = refDate ? new Date(refDate) : new Date();
      const days = PAY_PERIOD_TYPES[type].days;
      
      if (type === 'semimonthly') {
        const year = d.getFullYear();
        const month = d.getMonth();
        const day = d.getDate();
        
        if (day <= 15) {
          return Array.from({length:15}, (_,i) => fmt(new Date(year, month, i+1)));
        } else {
          const lastDay = new Date(year, month+1, 0).getDate();
          return Array.from({length:lastDay-15}, (_,i) => fmt(new Date(year, month, i+16)));
        }
      }
      
      // Weekly or bi-weekly
      const dayOfWeek = d.getDay();
      const mon = new Date(d);
      mon.setDate(d.getDate() - (dayOfWeek === 0 ? 6 : dayOfWeek - 1));
      mon.setHours(0,0,0,0);
      
      return Array.from({length:days}, (_,i) => {
        const dt = new Date(mon);
        dt.setDate(mon.getDate()+i);
        return fmt(dt);
      });
    };

    const getMonthDates = (year, month) => {
      const first = new Date(year, month, 1);
      const last = new Date(year, month+1, 0);
      const dates = [];
      for (let d = new Date(first); d <= last; d.setDate(d.getDate()+1)) {
        dates.push(fmt(new Date(d)));
      }
      return dates;
    };

    const formatDuration = (ms) => {
      const s = Math.floor(ms/1000);
      const h = Math.floor(s/3600);
      const m = Math.floor((s%3600)/60);
      const sec = s%60;
      return `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${sec.toString().padStart(2,'0')}`;
    };

    const msToHours = (ms) => Math.round((ms/3600000)*4)/4; // round to 0.25

    const generateId = () => Date.now().toString() + Math.random().toString(36).substr(2,5);

    // Enhanced recurring entry patterns
    const RECURRING_PATTERNS = {
      daily: { name: 'Daily', days: [1,2,3,4,5,6,0] },
      weekdays: { name: 'Weekdays Only', days: [1,2,3,4,5] },
      weekly: { name: 'Weekly (same day)', days: [] },
      biweekly: { name: 'Bi-Weekly', days: [] },
    };

    // ============================================
    // ENHANCED GITHUB GIST STORAGE
    // ============================================
    const GistStorage = {
      async loadData(token, gistId) {
        try {
          const res = await fetch(`https://api.github.com/gists/${gistId}`, { 
            headers: { 'Authorization': `token ${token}` } 
          });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const gist = await res.json();
          const content = gist.files[GIST_FILENAME]?.content;
          return content ? JSON.parse(content) : null;
        } catch (e) { 
          console.error('Load error:', e); 
          return null; 
        }
      },
      
      async saveData(token, gistId, data) {
        try {
          const res = await fetch(`https://api.github.com/gists/${gistId}`, {
            method: 'PATCH',
            headers: { 
              'Authorization': `token ${token}`, 
              'Content-Type': 'application/json' 
            },
            body: JSON.stringify({ 
              files: { 
                [GIST_FILENAME]: { 
                  content: JSON.stringify(data, null, 2) 
                } 
              } 
            })
          });
          return res.ok;
        } catch (e) { 
          console.error('Save error:', e); 
          return false; 
        }
      },
      
      async createGist(token) {
        try {
          const defaultData = {
            projects: [],
            timeEntries: [],
            notes: [],
            templates: [],
            recurringEntries: [],
            projectBudgets: {},
            mileageEntries: [],
            submittedWeeks: [],
            settings: {
              payPeriodType: 'weekly',
              utilizationTarget: 40,
              perDiemRate: 75,
              mileageRate: 0.655,
              billableTarget: 32,
            }
          };
          
          const res = await fetch('https://api.github.com/gists', {
            method: 'POST',
            headers: { 
              'Authorization': `token ${token}`, 
              'Content-Type': 'application/json' 
            },
            body: JSON.stringify({ 
              description: 'Jacobs TimeTracker Data v3', 
              public: false, 
              files: { 
                [GIST_FILENAME]: { 
                  content: JSON.stringify(defaultData, null, 2) 
                } 
              } 
            })
          });
          
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          return (await res.json()).id;
        } catch (e) { 
          console.error('Create gist error:', e); 
          return null; 
        }
      },
      
      async validateToken(token) {
        try {
          const res = await fetch('https://api.github.com/user', { 
            headers: { 'Authorization': `token ${token}` } 
          });
          return res.ok ? await res.json() : null;
        } catch (e) { 
          return null; 
        }
      }
    };

    // ============================================
    // PASSWORD HASHING
    // ============================================
    const hashPassword = async (pw) => {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(pw));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
    };

    // ============================================
    // PWA SERVICE WORKER & INSTALL
    // ============================================
    const PWAManager = {
      async register() {
        if ('serviceWorker' in navigator) {
          try {
            const swCode = `
              const CACHE_NAME = 'timetracker-v3-' + Date.now();
              const urlsToCache = ['/'];
              
              self.addEventListener('install', (event) => {
                event.waitUntil(
                  caches.open(CACHE_NAME).then((cache) => cache.addAll(urlsToCache))
                );
              });
              
              self.addEventListener('fetch', (event) => {
                event.respondWith(
                  caches.match(event.request).then((response) => {
                    return response || fetch(event.request);
                  })
                );
              });
            `;
            
            const blob = new Blob([swCode], { type: 'application/javascript' });
            const swUrl = URL.createObjectURL(blob);
            await navigator.serviceWorker.register(swUrl);
            
            return true;
          } catch (e) {
            console.error('SW registration failed:', e);
            return false;
          }
        }
        return false;
      },
      
      async checkInstallPrompt() {
        return new Promise((resolve) => {
          let deferredPrompt = null;
          
          window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            resolve(deferredPrompt);
          });
          
          // Timeout after 2 seconds
          setTimeout(() => resolve(null), 2000);
        });
      }
    };

        setTimeout(() => setToasts(p => p.filter(t => t.id !== id)), duration);
      }, []);
      
      const removeToast = useCallback((id) => {
        setToasts(p => p.filter(t => t.id !== id));
      }, []);
      
      return (
        <ToastContext.Provider value={{ addToast, removeToast }}>
          {children}
          <div className="fixed bottom-6 right-6 z-[9999] space-y-3 no-print">
            {toasts.map(t => (
              <div key={t.id} 
                className={`toast glass-light rounded-2xl px-6 py-4 flex items-center gap-3 cursor-pointer transform transition-all hover:scale-105 ${
                  t.type === 'error' ? 'border-red-500/40 glow-rose' :

                <span className="text-sm font-medium">{t.msg}</span>
                <button className="text-white/40 hover:text-white/60 ml-2">✕</button>

          return p.slice(0,-1);
        });
        return action;
      }, []);
      
      const clearUndo = useCallback(() => {
        setUndoStack([]);
      }, []);
      
      return (
        <UndoContext.Provider value={{ 
          pushUndo, 
          popUndo, 
          clearUndo,
          hasUndo: undoStack.length > 0,
          undoCount: undoStack.length

      const currentPeriodHours = useMemo(() =>
        timeEntries.filter(e => currentPeriodDates.includes(e.date)).reduce((s,e) => s + e.hours, 0),

      // Weekly hours for backwards compatibility
      const weeklyHours = useMemo(() =>

      // Billable vs non-billable tracking
      const utilizationStats = useMemo(() => {
        const currentEntries = timeEntries.filter(e => currentPeriodDates.includes(e.date));
        const billable = currentEntries.filter(e => e.tags?.includes('billable')).reduce((s,e) => s + e.hours, 0);
        const nonBillable = currentEntries.filter(e => e.tags?.includes('nonbillable')).reduce((s,e) => s + e.hours, 0);
        const total = currentPeriodHours;
        
        return {
          billable,
          nonBillable,
          total,
          billableRate: total > 0 ? (billable / total) * 100 : 0,
          utilizationRate: total > 0 ? (total / settings.utilizationTarget) * 100 : 0,

      }, [timeEntries, currentPeriodDates, currentPeriodHours, settings.utilizationTarget]);

      // Smart suggestions based on patterns
      const smartSuggestions = useMemo(() => {
        if (!settings.smartSuggestionsEnabled) return [];
        
        const todayDow = new Date().getDay();
        const recentEntries = timeEntries
          .filter(e => {
            const entryDate = parseDate(e.date);
            const daysDiff = (new Date() - entryDate) / (1000 * 60 * 60 * 24);
            return daysDiff <= 30 && entryDate.getDay() === todayDow;
          })
          .slice(-10);

        const patterns = {};
        recentEntries.forEach(e => {
          const key = `${e.projectId}-${e.costCode}`;
          if (!patterns[key]) {
            patterns[key] = { 
              count: 0, 
              totalHours: 0, 
              project: e.projectName,
              projectId: e.projectId,
              costCode: e.costCode,
              lastDescription: e.description 
            };
          }
          patterns[key].count++;
          patterns[key].totalHours += e.hours;
          patterns[key].lastDescription = e.description;
        });

        return Object.values(patterns)
          .filter(p => p.count >= 2)
          .map(p => ({
            ...p,
            avgHours: Math.round((p.totalHours / p.count) * 4) / 4,
            confidence: Math.min(100, (p.count / 4) * 100)

          .sort((a, b) => b.confidence - a.confidence)

      }, [timeEntries, settings.smartSuggestionsEnabled]);

          id: generateId(),

        const targetDate = parseDate(date);
        const dayOfWeek = targetDate.getDay();
        const generated = [];

        recurringEntries
          .filter(re => re.isActive)
          .forEach(re => {
            const shouldGenerate = 
              re.pattern === 'daily' ||
              (re.pattern === 'weekdays' && dayOfWeek >= 1 && dayOfWeek <= 5) ||
              (re.pattern === 'weekly' && dayOfWeek === re.dayOfWeek) ||
              (re.pattern === 'biweekly' && dayOfWeek === re.dayOfWeek && 
               Math.floor((targetDate - parseDate(re.startDate)) / (1000 * 60 * 60 * 24)) % 14 === 0);

            if (shouldGenerate) {
              const project = projects.find(p => p.id === re.projectId);
              if (project) {

    // ============================================
    // ENHANCED FLOATING PANEL
    // ============================================
    // Global z-index counter for panel focus
    let globalZCounter = 100;

    const FloatingPanel = ({ children, title, icon, defaultPosition = {x:100,y:100}, glowColor='cyan', onClose, width=400, minHeight=200, zIndex=10 }) => {
      const isMobile = window.innerWidth < 768;
      const [position, setPosition] = useState(isMobile ? {x:0,y:70} : defaultPosition);
      const [velocity, setVelocity] = useState({x:0,y:0});
      const [isDragging, setIsDragging] = useState(false);
      const [isVisible, setIsVisible] = useState(true);
      const [isMinimized, setIsMinimized] = useState(false);
      const [isMaximized, setIsMaximized] = useState(false);
      const [currentZ, setCurrentZ] = useState(zIndex);
      const panelRef = useRef(null);
      const dragStart = useRef({x:0,y:0});
      const lastPos = useRef({x:0,y:0});
      const animFrame = useRef(null);

      const bringToFront = () => { globalZCounter++; setCurrentZ(globalZCounter); };

      const friction = 0.88, bounce = 0.4;

      // Physics-based momentum after drag release (uses refs to avoid re-rendering children)
      const velRef = useRef({x:0,y:0});
      const posRef = useRef(position);
      posRef.current = position;

      useEffect(() => {
        if (isMobile || isDragging || isMaximized) return;
        velRef.current = {...velocity};
        
        const animate = () => {
          const v = velRef.current;
          if (Math.abs(v.x) < 0.3 && Math.abs(v.y) < 0.3) return;
          
          v.x *= friction;
          v.y *= friction;
          let np = { x: posRef.current.x + v.x, y: posRef.current.y + v.y };
          
          const maxX = window.innerWidth - width - 20;
          const maxY = window.innerHeight - 100;
          
          if (np.x < 20) { np.x = 20; v.x = -v.x*bounce; }
          if (np.x > maxX) { np.x = maxX; v.x = -v.x*bounce; }
          if (np.y < 80) { np.y = 80; v.y = -v.y*bounce; }
          if (np.y > maxY) { np.y = maxY; v.y = -v.y*bounce; }
          
          // Direct DOM update to avoid React re-renders during animation
          if (panelRef.current) {
            panelRef.current.style.left = np.x + 'px';
            panelRef.current.style.top = np.y + 'px';
          }
          posRef.current = np;
          animFrame.current = requestAnimationFrame(animate);
        };
        
        animFrame.current = requestAnimationFrame(animate);
        return () => cancelAnimationFrame(animFrame.current);
      }, [isDragging]);

      const handlePointerDown = (e) => {
        if (isMobile || isMaximized) return;
        if (e.target.closest('input, button, select, textarea, a')) return;
        
        setIsDragging(true);
        dragStart.current = { x: e.clientX - position.x, y: e.clientY - position.y };
        lastPos.current = { x: e.clientX, y: e.clientY };
      };

      // Dragging logic — direct DOM for smoothness, sync state on release
      useEffect(() => {
        if (!isDragging) return;
        
        const move = (e) => {
          const np = { x: e.clientX - dragStart.current.x, y: e.clientY - dragStart.current.y };
          velRef.current = { x: e.clientX - lastPos.current.x, y: e.clientY - lastPos.current.y };
          lastPos.current = { x: e.clientX, y: e.clientY };
          posRef.current = np;
          if (panelRef.current) {
            panelRef.current.style.left = np.x + 'px';
            panelRef.current.style.top = np.y + 'px';
          }
        };
        
        const up = () => {
          setPosition(posRef.current);
          setVelocity(velRef.current);
          setIsDragging(false);
        };
        
        window.addEventListener('mousemove', move);
        window.addEventListener('mouseup', up);
        
        return () => { 
          window.removeEventListener('mousemove', move); 
          window.removeEventListener('mouseup', up); 
        };
      }, [isDragging]);

        setIsMaximized(!isMaximized);
        setIsMinimized(false);

    const AutocompleteInput = ({ value, onChange, suggestions = [], placeholder, className, icon }) => {
      const [show, setShow] = useState(false);
      const [filtered, setFiltered] = useState([]);
      const [selectedIndex, setSelectedIndex] = useState(-1);
      const ref = useRef(null);

      useEffect(() => {
        if (value && show) {
          const matches = suggestions
            .filter(s => s.toLowerCase().includes(value.toLowerCase()))
            .slice(0, 8);
          setFiltered(matches);
          setSelectedIndex(-1);
        } else {
          setFiltered([]);
        }
      }, [value, suggestions, show]);

      const handleKeyDown = (e) => {
        if (!show || filtered.length === 0) return;
        
        switch (e.key) {
          case 'ArrowDown':
            e.preventDefault();
            setSelectedIndex(i => (i + 1) % filtered.length);
            break;
          case 'ArrowUp':
            e.preventDefault();
            setSelectedIndex(i => i <= 0 ? filtered.length - 1 : i - 1);
            break;
          case 'Enter':
            if (selectedIndex >= 0) {
              e.preventDefault();
              onChange(filtered[selectedIndex]);
              setShow(false);
            }
            break;
          case 'Escape':
            setShow(false);
            break;
        }
      };

      return (
        <div className="relative" ref={ref}>
          <div className="relative">
            {icon && (
              <span className="absolute left-3 top-1/2 transform -translate-y-1/2 text-white/40">
                {icon}
              </span>
            )}
            <input 
              type="text" 
              value={value} 
              onChange={(e) => onChange(e.target.value)}
              onFocus={() => setShow(true)} 
              onBlur={() => setTimeout(() => setShow(false), 200)}
              onKeyDown={handleKeyDown}
              placeholder={placeholder} 
              className={`${className} ${icon ? 'pl-10' : ''} focus-ring`} 
            />
          </div>
          
          {filtered.length > 0 && show && (
            <div className="autocomplete-dropdown mt-2 w-full">
              {filtered.map((s, i) => (
                <div 
                  key={i} 
                  className={`px-4 py-3 hover:bg-white/10 cursor-pointer text-sm transition-colors ${
                    i === selectedIndex ? 'bg-cyan-500/20' : ''
                  }`}
                  onMouseDown={() => { onChange(s); setShow(false); }}
                  onMouseEnter={() => setSelectedIndex(i)}>
                  <span className="text-white/90">{s}</span>
                </div>
              ))}
            </div>
          )}
        </div>
      );
    };

      const [employeeId, setEmployeeId] = useState('');

      const [error, setError] = useState('');
      const [user, setUser] = useState(null);

      const handleValidateToken = async () => {
        setLoading(true); 
        setError('');
        
        try {
          const userData = await GistStorage.validateToken(token);
          if (userData) { 
            setUser(userData); 
            setName(userData.name || userData.login); 
            setStep(2); 
          } else {
            setError('Invalid token. Make sure it has "gist" scope.');
          }
        } catch (e) {
          setError('Network error. Please try again.');
        }
        
        setLoading(false);
      };

      const handleComplete = async () => {
        if (password.length < 4) { 
          setError('Password must be at least 4 characters.'); 
          return; 
        }
        if (password !== confirmPassword) { 
          setError('Passwords do not match.'); 
          return; 
        }
        
        setLoading(true); 
        setError('');
        
        try {
          let gistId = localStorage.getItem('jtt_gist_id_v3');

            name, 
            employeeId, 
            login: user.login, 
            avatar: user.avatar_url, 
            passwordHash 
          }));
          localStorage.setItem('jtt_session_v3', 'active');
          
          onComplete({ 
            token, 
            gistId, 
            user: { 
              name, 
              employeeId, 
              login: user.login, 
              avatar: user.avatar_url

          setError('Setup failed. Please try again.');

          <div className="orb w-80 h-80 bg-violet-500 top-1/2 -right-40" style={{ animationDelay: '-8s' }} />

              ))}

            {step === 1 && (
              <div className="space-y-6 slide-up">
                <div className="p-6 rounded-2xl bg-gradient-to-r from-cyan-500/10 to-emerald-500/10 border border-cyan-500/20">
                  <h3 className="text-white font-semibold text-lg mb-3">🔐 Step 1: GitHub Integration</h3>
                  <p className="text-white/70 text-sm mb-4">
                    Connect to GitHub for secure cloud storage of your timesheet data.
                  </p>
                  <ol className="text-sm text-white/60 space-y-2 list-decimal list-inside">
                    <li>Visit <a href="https://github.com/settings/tokens/new?scopes=gist&description=Jacobs%20TimeTracker" target="_blank" className="text-cyan-400 hover:underline font-medium">GitHub Token Settings ↗</a></li>
                    <li>Generate a new token with <strong className="text-white">gist</strong> scope</li>
                    <li>Copy and paste the token below</li>

                </div>
                
                <div>
                  <label className="block text-sm text-white/70 mb-3 font-medium">
                    🔑 GitHub Personal Access Token
                  </label>
                  <input 
                    type="password" 
                    value={token} 
                    onChange={e => setToken(e.target.value)} 
                    onKeyDown={e => e.key === 'Enter' && !loading && handleValidateToken()}
                    placeholder="ghp_xxxxxxxxxxxxxxxxxxxx" 
                    className="w-full bg-white/5 border border-white/20 rounded-2xl px-6 py-4 font-mono text-sm focus-ring" 
                    autoFocus 
                  />
                </div>
                
                {error && (
                  <div className="text-red-400 text-sm p-4 rounded-2xl bg-red-500/10 border border-red-500/30 slide-up">
                    ❌ {error}
                  </div>
                )}
                
                <button 
                  onClick={handleValidateToken} 
                  disabled={!token || loading}
                  className="w-full py-4 rounded-2xl bg-gradient-to-r from-cyan-500 to-emerald-500 hover:from-cyan-400 hover:to-emerald-400 text-white font-semibold disabled:opacity-50 disabled:cursor-not-allowed transition-all btn-glow transform hover:scale-[1.02]">
                  {loading ? (
                    <span className="flex items-center justify-center gap-2">
                      <span className="w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin" />

                </button>
              </div>

            {step === 2 && (
              <div className="space-y-6 slide-up">
                <div className="flex items-center gap-4 p-4 rounded-2xl bg-gradient-to-r from-emerald-500/10 to-cyan-500/10 border border-emerald-500/30">
                  <img src={user.avatar_url} className="w-16 h-16 rounded-full border-2 border-emerald-500/30" />
                  <div>
                    <div className="text-emerald-400 text-sm font-medium">✅ Connected as</div>

                <div>
                  <label className="block text-sm text-white/70 mb-2 font-medium">👤 Your Full Name</label>

                    type="text" 
                    value={name}

                    className="w-full bg-white/5 border border-white/20 rounded-2xl px-6 py-4 focus-ring"

                <div>

                  <input 
                    type="text" 
                    value={employeeId} 
                    onChange={e => setEmployeeId(e.target.value)} 
                    placeholder="J12345" 
                    className="w-full bg-white/5 border border-white/20 rounded-2xl px-6 py-4 font-mono focus-ring"

                  className="w-full py-4 rounded-2xl bg-gradient-to-r from-cyan-500 to-emerald-500 hover:from-cyan-400 hover:to-emerald-400 text-white font-semibold disabled:opacity-50 disabled:cursor-not-allowed transition-all btn-glow transform hover:scale-[1.02]">

                  <h3 className="text-white font-semibold text-lg mb-2">🔒 Step 3: Secure Login</h3>
                  <p className="text-white/70 text-sm">
                    Create a password to protect your timesheet data. This is separate from GitHub.
                  </p>
                </div>
                
                <div>
                  <label className="block text-sm text-white/70 mb-2 font-medium">🔐 Choose Password</label>
                  <input 
                    type="password" 
                    value={password} 
                    onChange={e => setPassword(e.target.value)} 
                    placeholder="At least 4 characters" 
                    className="w-full bg-white/5 border border-white/20 rounded-2xl px-6 py-4 focus-ring" 
                    autoFocus 
                  />
                </div>
                
                <div>
                  <label className="block text-sm text-white/70 mb-2 font-medium">🔁 Confirm Password</label>
                  <input 
                    type="password" 
                    value={confirmPassword} 
                    onChange={e => setConfirmPassword(e.target.value)} 
                    onKeyDown={e => e.key === 'Enter' && !loading && handleComplete()}
                    placeholder="Repeat password"
                    className="w-full bg-white/5 border border-white/20 rounded-2xl px-6 py-4 focus-ring" 
                  />
                </div>
                
                {error && (
                  <div className="text-red-400 text-sm p-4 rounded-2xl bg-red-500/10 border border-red-500/30 slide-up">
                    ❌ {error}
                  </div>
                )}
                
                <button 
                  onClick={handleComplete} 
                  disabled={!password || !confirmPassword || loading}
                  className="w-full py-4 rounded-2xl bg-gradient-to-r from-violet-500 to-cyan-500 hover:from-violet-400 hover:to-cyan-400 text-white font-semibold disabled:opacity-50 disabled:cursor-not-allowed transition-all btn-glow transform hover:scale-[1.02]">
                  {loading ? (
                    <span className="flex items-center justify-center gap-2">
                      <span className="w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin" />
                      Setting up...
                    </span>
                  ) : (
                    '🚀 Start Tracking'
                  )}
                </button>
                
                <div className="text-center text-white/40 text-xs">
                  Your data is encrypted and stored securely in GitHub Gists
                </div>
              </div>
            )}
          </div>
        </div>
      );
    };

    // ============================================
    // LOGIN SCREEN (Enhanced)
    // ============================================
    const LoginScreen = ({ credentials, onLogin, onReset }) => {
      const [password, setPassword] = useState('');
      const [error, setError] = useState('');
      const [loading, setLoading] = useState(false);
      const [showReset, setShowReset] = useState(false);

      const handleLogin = async () => {
        setLoading(true); 
        setError('');
        
        try {
          const hash = await hashPassword(password);
          if (hash === credentials.passwordHash) {
            localStorage.setItem('jtt_session_v3', 'active');
            const storage = JSON.parse(localStorage.getItem('jtt_storage_v3'));
            onLogin({ 
              token: storage.token, 
              gistId: storage.gistId, 
              user: { 
                name: credentials.name, 
                employeeId: credentials.employeeId, 
                login: credentials.login, 
                avatar: credentials.avatar 
              } 
            });
          } else { 
            setError('Incorrect password. Please try again.'); 
          }
        } catch (e) {
          setError('Login failed. Please try again.');
        }
        
        setLoading(false); 
        setPassword('');
      };

      const handleReset = () => {
        if (showReset) {
          onReset();
        } else {
          setShowReset(true);
          setTimeout(() => setShowReset(false), 5000);
        }
      };

      return (
        <div className="min-h-screen flex items-center justify-center p-4 relative">
          {/* Enhanced background orbs */}
          <div className="orb w-96 h-96 bg-cyan-500 -top-48 -left-48" style={{ animationDelay: '0s' }} />
          <div className="orb w-80 h-80 bg-violet-500 top-1/2 -right-40" style={{ animationDelay: '-8s' }} />
          <div className="orb w-64 h-64 bg-emerald-500 -bottom-32 left-1/3" style={{ animationDelay: '-16s' }} />
          
          <div className="glass rounded-3xl p-8 w-full max-w-md glow-cyan panel-enter relative z-10">
            <div className="text-center mb-8">
              <div className="w-24 h-24 mx-auto mb-6 rounded-3xl bg-gradient-to-br from-cyan-500 via-emerald-500 to-violet-500 flex items-center justify-center shadow-2xl">
                <svg className="w-12 h-12 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
              </div>
              <h1 className="text-4xl font-bold bg-gradient-to-r from-cyan-400 via-emerald-400 to-violet-400 bg-clip-text text-transparent">
                TimeTracker
              </h1>
              <p className="text-white/60 mt-3">Welcome back</p>
            </div>
            
            <div className="space-y-6">
              <div className="flex items-center gap-4 p-4 rounded-2xl bg-white/5 border border-white/10">
                {credentials.avatar && (
                  <img src={credentials.avatar} className="w-14 h-14 rounded-full border-2 border-cyan-500/30" />
                )}
                <div className="flex-1">
                  <div className="text-white/50 text-sm">Signed in as</div>
                  <div className="font-semibold text-xl">{credentials.name}</div>
                  {credentials.employeeId && (
                    <div className="text-white/40 text-xs font-mono">{credentials.employeeId}</div>
                  )}
                </div>
              </div>
              
              <div>
                <label className="block text-sm text-white/70 mb-2 font-medium">🔐 Password</label>
                <input 
                  type="password" 
                  value={password} 
                  onChange={e => setPassword(e.target.value)} 
                  onKeyDown={e => e.key === 'Enter' && !loading && handleLogin()}
                  placeholder="Enter your password" 
                  className="w-full bg-white/5 border border-white/20 rounded-2xl px-6 py-4 focus-ring" 
                  autoFocus 
                />
              </div>
              
              {error && (
                <div className="text-red-400 text-sm p-4 rounded-2xl bg-red-500/10 border border-red-500/30 slide-up">
                  ❌ {error}
                </div>
              )}
              
              <button 
                onClick={handleLogin} 
                disabled={!password || loading}
                className="w-full py-4 rounded-2xl bg-gradient-to-r from-cyan-500 to-emerald-500 hover:from-cyan-400 hover:to-emerald-400 text-white font-semibold disabled:opacity-50 disabled:cursor-not-allowed transition-all btn-glow transform hover:scale-[1.02]">
                {loading ? (
                  <span className="flex items-center justify-center gap-2">
                    <span className="w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin" />
                    Logging in...
                  </span>
                ) : (
                  '🚀 Enter TimeTracker'
                )}
              </button>
              
              <button 
                onClick={handleReset} 
                className={`w-full text-center text-sm transition-all ${
                  showReset 
                    ? 'text-red-400 hover:text-red-300 bg-red-500/10 py-2 rounded-xl border border-red-500/30' 
                    : 'text-white/30 hover:text-white/50'
                }`}>
                {showReset ? '⚠️ Click again to reset all data' : 'Reset account'}
              </button>
            </div>
          </div>
        </div>
      );
    };

    // ============================================
    // MAIN APP (Enhanced)
    // ============================================
    const App = () => {
      const [authInfo, setAuthInfo] = useState(null);
      const [credentials, setCredentials] = useState(() => {
        const saved = localStorage.getItem('jtt_credentials_v3');
        return saved ? JSON.parse(saved) : null;
      });

      useEffect(() => {
        const session = localStorage.getItem('jtt_session_v3');
        if (session === 'active' && credentials) {
          const storage = localStorage.getItem('jtt_storage_v3');
          if (storage) {
            const { token, gistId } = JSON.parse(storage);
            setAuthInfo({ 
              token, 
              gistId, 
              user: { 
                name: credentials.name, 
                employeeId: credentials.employeeId, 
                login: credentials.login, 
                avatar: credentials.avatar 
              } 
            });
          }
        }
      }, [credentials]);

      const handleReset = () => {
        const keysToRemove = [
          'jtt_storage_v3', 'jtt_credentials_v3', 'jtt_session_v3', 
          'jtt_gist_id_v3', 'jtt_timer_v3', 'jtt_theme', 'jtt_pwa_dismissed'
        ];
        keysToRemove.forEach(k => localStorage.removeItem(k));
        setAuthInfo(null); 
        setCredentials(null);
      };

      if (!credentials) {
        return (
          <ThemeProvider>
            <ToastProvider>
              <SetupScreen onComplete={(info) => { 
                setAuthInfo(info); 
                setCredentials(JSON.parse(localStorage.getItem('jtt_credentials_v3'))); 
              }} />
            </ToastProvider>
          </ThemeProvider>
        );
      }

      if (!authInfo) {
        return (
          <ThemeProvider>
            <ToastProvider>
              <LoginScreen 
                credentials={credentials} 
                onLogin={setAuthInfo} 
                onReset={handleReset}

    const ProjectBudgetsPanel = () => {
      const { projects, projectBudgets, setProjectBudgets, timeEntries } = useData();
      const toast = useToast();
      const [editingBudget, setEditingBudget] = useState(null);
      const [budgetHours, setBudgetHours] = useState('');

      const projectStats = useMemo(() => {
        return projects.map(project => {
          const budget = projectBudgets[project.id];
          const totalHours = timeEntries
            .filter(e => e.projectId === project.id)
            .reduce((sum, e) => sum + e.hours, 0);
          
          const utilizationRate = budget?.totalHours ? (totalHours / budget.totalHours) * 100 : 0;
          const remainingHours = budget?.totalHours ? Math.max(0, budget.totalHours - totalHours) : 0;
          const isOverBudget = budget?.totalHours && totalHours > budget.totalHours;
          
          return {
            project,
            budget,
            totalHours,
            utilizationRate,
            remainingHours,
            isOverBudget,
            daysRemaining: budget?.endDate ? Math.max(0, (parseDate(budget.endDate) - new Date()) / (1000 * 60 * 60 * 24)) : null
          };
        });
      }, [projects, projectBudgets, timeEntries]);

      const handleSetBudget = (projectId) => {
        if (!budgetHours || budgetHours <= 0) {
          toast('Please enter a valid budget amount', 'warning');
          return;
        }

        const updatedBudgets = {
          ...projectBudgets,
          [projectId]: {
            totalHours: parseFloat(budgetHours),
            startDate: today(),
            endDate: null, // Could add date picker for this
            createdAt: new Date().toISOString()
          }
        };
        
        setProjectBudgets(updatedBudgets);
        setEditingBudget(null);
        setBudgetHours('');
        toast('Project budget set successfully', 'success');
      };

      const removeBudget = (projectId) => {
        const updatedBudgets = { ...projectBudgets };
        delete updatedBudgets[projectId];
        setProjectBudgets(updatedBudgets);
        toast('Budget removed', 'success');
      };

      return (
        <div className="space-y-6">
          <div>
            <h2 className="text-lg font-bold">💰 Project Budgets</h2>
            <p className="text-xs text-white/50">Track hour budgets and burn rates</p>
          </div>

          <div className="space-y-4">
            {projectStats.map(({ project, budget, totalHours, utilizationRate, remainingHours, isOverBudget, daysRemaining }) => (
              <div key={project.id} 
                className={`p-4 rounded-xl border transition-all ${
                  isOverBudget 
                    ? 'bg-red-500/10 border-red-500/30' 
                    : budget 
                      ? 'bg-white/5 border-white/10 hover:bg-white/8' 
                      : 'bg-white/5 border-white/10'
                }`}>
                
                <div className="flex items-start justify-between mb-3">

                    <h3 className="font-medium text-white/90">{project.name}</h3>
                    <div className="text-xs text-white/50 font-mono">{project.number}</div>

                  <div className="flex gap-2">
                    {budget ? (
                      <>
                        <button
                          onClick={() => {
                            setEditingBudget(project.id);
                            setBudgetHours(budget.totalHours.toString());
                          }}
                          className="w-8 h-8 rounded-lg bg-cyan-500/20 text-cyan-400 hover:bg-cyan-500/30 flex items-center justify-center transition-all"
                          title="Edit Budget">
                          ✏️
                        </button>
                        <button
                          onClick={() => removeBudget(project.id)}
                          className="w-8 h-8 rounded-lg bg-red-500/20 text-red-400 hover:bg-red-500/30 flex items-center justify-center transition-all"
                          title="Remove Budget">
                          🗑️
                        </button>

                    ) : (
                      <button

                        className="px-3 py-1 text-xs bg-violet-500/20 text-violet-400 hover:bg-violet-500/30 rounded-lg transition-all">
                        Set Budget
                      </button>

                  </div>
                </div>

                {budget && (
                  <div className="space-y-3">
                    <div className="flex justify-between items-center text-sm">
                      <span>Hours Used</span>
                      <span className={`font-mono font-bold ${
                        isOverBudget ? 'text-red-400' : 'text-emerald-400'
                      }`}>
                        {totalHours.toFixed(1)} / {budget.totalHours}h
                      </span>
                    </div>
                    
                    <div className="w-full bg-white/10 rounded-full h-3 overflow-hidden">
                      <div 
                        className={`h-full rounded-full transition-all duration-700 ${
                          isOverBudget 
                            ? 'bg-gradient-to-r from-red-500 to-red-400'

                              ? 'bg-gradient-to-r from-amber-500 to-amber-400'

                        style={{ width: `${Math.min(100, utilizationRate)}%` }}

                    <div className="grid grid-cols-2 gap-4 text-xs">

                    </div>
                  </div>

      const toast = useToast();
      const [isAdding, setIsAdding] = useState(false);
      const [editingId, setEditingId] = useState(null);
      const [form, setForm] = useState({ name: '', number: '', costCodes: '', color: 'cyan' });
      const colors = ['cyan','emerald','amber','violet','rose','blue'];

      const projectHours = useMemo(() => {
        const h = {};
        timeEntries.forEach(e => { h[e.projectId] = (h[e.projectId]||0) + e.hours; });
        return h;
      }, [timeEntries]);

      const handleAdd = () => {
        if (!form.name || !form.number) return;
        addProject({ name: form.name, number: form.number, costCodes: form.costCodes.split(',').map(c => c.trim()).filter(Boolean), color: form.color });
        setForm({ name: '', number: '', costCodes: '', color: 'cyan' });
        setIsAdding(false);
        toast('Project added');
      };

      const handleUpdate = (id) => {
        if (!form.name || !form.number) return;
        updateProject(id, { name: form.name, number: form.number, costCodes: form.costCodes.split(',').map(c => c.trim()).filter(Boolean), color: form.color });

        toast('Project updated');

        setForm({ name: p.name, number: p.number, costCodes: p.costCodes.join(', '), color: p.color });

      const handleDelete = (p) => {
        const count = timeEntries.filter(e => e.projectId === p.id).length;

        deleteProject(p.id);

          <input type="text" value={form.name} onChange={e => setForm({...form, name: e.target.value})}

            <button onClick={() => { setIsAdding(false); setEditingId(null); }} className="px-4 py-2.5 rounded-xl bg-white/10 hover:bg-white/20 transition-colors">Cancel</button>

        </div>

      return (
        <div className="space-y-4">

            editingId === p.id ? (
              <ProjectForm key={p.id} onSubmit={() => handleUpdate(p.id)} submitLabel="Save" />

              <div key={p.id} className="p-4 rounded-xl bg-white/5 group hover:bg-white/8 transition-colors">
                <div className="flex items-start justify-between">
                  <div className="flex-1">
                    <div className="flex items-center gap-2">

                      <span className="font-mono text-sm text-cyan-400">{p.number}</span>

                    <div className="font-medium mt-1">{p.name}</div>
                    <div className="flex flex-wrap gap-1 mt-2">

                    <div className="text-xs text-white/40 mt-2 font-mono">{(projectHours[p.id]||0).toFixed(1)}h logged</div>
                  </div>
                  <div className="flex gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
                    <button onClick={() => startEdit(p)} className="w-8 h-8 rounded-lg bg-white/10 hover:bg-white/20 flex items-center justify-center text-xs">✏️</button>
                    <button onClick={() => handleDelete(p)} className="w-8 h-8 rounded-lg bg-red-500/20 hover:bg-red-500/30 flex items-center justify-center text-xs">🗑️</button>

              </div>

            <ProjectForm onSubmit={handleAdd} submitLabel="Add Project" />

              className="w-full py-3 rounded-xl border-2 border-dashed border-white/20 text-white/50 hover:border-cyan-500/50 hover:text-cyan-400 transition-colors">
              + Add New Project
            </button>
          )}
        </div>
      );
    };

    // ============================================
    // SEARCH PANEL
    // ============================================
    const SearchPanel = () => {
      const { timeEntries, projects, deleteTimeEntry, updateTimeEntry } = useData();
      const { pushUndo } = useUndo();
      const toast = useToast();
      const [query, setQuery] = useState('');
      const [projectFilter, setProjectFilter] = useState('');
      const [dateFrom, setDateFrom] = useState('');
      const [dateTo, setDateTo] = useState('');

      const results = useMemo(() => {
        return timeEntries.filter(e => {
          if (projectFilter && e.projectId !== projectFilter) return false;
          if (dateFrom && e.date < dateFrom) return false;
          if (dateTo && e.date > dateTo) return false;
          if (query) {
            const q = query.toLowerCase();
            return (e.description||'').toLowerCase().includes(q) || (e.projectName||'').toLowerCase().includes(q) || (e.costCode||'').toLowerCase().includes(q);
          }
          return true;
        }).sort((a,b) => b.date.localeCompare(a.date));
      }, [timeEntries, query, projectFilter, dateFrom, dateTo]);

      const totalHours = results.reduce((s,e) => s + e.hours, 0);

      return (
        <div className="space-y-4">
          <input type="text" value={query} onChange={e => setQuery(e.target.value)} placeholder="Search entries..."
            className="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 focus-ring" />
          <div className="grid grid-cols-3 gap-2">
            <select value={projectFilter} onChange={e => setProjectFilter(e.target.value)}
              className="bg-white/5 border border-white/10 rounded-xl px-3 py-2 text-sm">
              <option value="" style={{color:'#000'}}>All Projects</option>
              {projects.map(p => <option key={p.id} value={p.id} style={{color:'#000'}}>{p.name}</option>)}
            </select>
            <input type="date" value={dateFrom} onChange={e => setDateFrom(e.target.value)} className="bg-white/5 border border-white/10 rounded-xl px-3 py-2 text-sm" />
            <input type="date" value={dateTo} onChange={e => setDateTo(e.target.value)} className="bg-white/5 border border-white/10 rounded-xl px-3 py-2 text-sm" />
          </div>
          <div className="text-sm text-white/50">{results.length} entries · {totalHours.toFixed(1)}h total</div>
          <div className="space-y-2 max-h-96 overflow-y-auto">
            {results.slice(0, 50).map(e => (
              <div key={e.id} className="p-3 rounded-xl bg-white/5 hover:bg-white/8 group transition-colors">
                <div className="flex justify-between items-start">
                  <div>
                    <div className="text-xs text-white/40 font-mono">{e.date} · {e.projectName}</div>
                    <div className="text-sm mt-1">{e.description || e.costCode}</div>
                  </div>
                  <div className="flex items-center gap-2">
                    <span className="font-mono text-sm text-cyan-400">{e.hours}h</span>
                    <button onClick={() => { const d = deleteTimeEntry(e.id); if(d) { pushUndo({type:'deleteEntry',entry:d}); toast('Deleted'); } }}
                      className="w-6 h-6 rounded bg-red-500/20 items-center justify-center text-xs opacity-0 group-hover:opacity-100 transition-opacity hidden group-hover:flex">✕</button>
                  </div>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    };

    // ============================================
    // ANALYTICS PANEL
    // ============================================
    const AnalyticsPanel = () => {
      const { timeEntries, projects, utilizationStats, currentPeriodHours, settings } = useData();

      const projectBreakdown = useMemo(() => {
        const byProject = {};
        timeEntries.forEach(e => {
          if (!byProject[e.projectId]) byProject[e.projectId] = { name: e.projectName, hours: 0, color: projects.find(p => p.id === e.projectId)?.color || 'cyan' };
          byProject[e.projectId].hours += e.hours;
        });
        return Object.values(byProject).sort((a,b) => b.hours - a.hours);
      }, [timeEntries, projects]);

      const last7Days = useMemo(() => {
        const days = [];
        for (let i = 6; i >= 0; i--) {
          const d = new Date(); d.setDate(d.getDate() - i);
          const dateStr = fmt(d);
          const hours = timeEntries.filter(e => e.date === dateStr).reduce((s,e) => s + e.hours, 0);
          days.push({ date: dateStr, day: ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()], hours });

        return days;
      }, [timeEntries]);

      const maxDayHours = Math.max(...last7Days.map(d => d.hours), 1);

      return (
        <div className="space-y-6">
          <div className="grid grid-cols-3 gap-3">
            <div className="p-3 rounded-xl bg-cyan-500/10 border border-cyan-500/20 text-center">
              <div className="text-xs text-cyan-300">This Period</div>
              <div className="text-xl font-bold font-mono text-cyan-400">{currentPeriodHours.toFixed(1)}h</div>
            </div>
            <div className="p-3 rounded-xl bg-emerald-500/10 border border-emerald-500/20 text-center">
              <div className="text-xs text-emerald-300">Utilization</div>
              <div className="text-xl font-bold font-mono text-emerald-400">{Math.round(utilizationStats.utilizationRate)}%</div>
            </div>
            <div className="p-3 rounded-xl bg-amber-500/10 border border-amber-500/20 text-center">
              <div className="text-xs text-amber-300">Total Entries</div>
              <div className="text-xl font-bold font-mono text-amber-400">{timeEntries.length}</div>
            </div>
          </div>

          <div>
            <h3 className="text-sm font-medium text-white/60 mb-3">Last 7 Days</h3>
            <div className="flex items-end gap-2 h-32">
              {last7Days.map(d => (
                <div key={d.date} className="flex-1 flex flex-col items-center gap-1">
                  <div className="text-xs font-mono text-white/40">{d.hours > 0 ? d.hours.toFixed(1) : ''}</div>
                  <div className="w-full rounded-t-lg bg-gradient-to-t from-cyan-500/40 to-cyan-400/20 transition-all" style={{height: `${(d.hours/maxDayHours)*80}px`, minHeight: d.hours > 0 ? '4px' : '0'}} />
                  <div className="text-xs text-white/30">{d.day}</div>
                </div>
              ))}
            </div>
          </div>

          <div>
            <h3 className="text-sm font-medium text-white/60 mb-3">By Project</h3>
            <div className="space-y-2">
              {projectBreakdown.slice(0, 8).map(p => {

                return (
                  <div key={p.name} className="space-y-1">
                    <div className="flex justify-between text-sm">
                      <span className="text-white/70 truncate">{p.name}</span>
                      <span className="font-mono text-white/50">{p.hours.toFixed(1)}h</span>
                    </div>
                    <div className="h-2 rounded-full bg-white/5 overflow-hidden">
                      <div className={`h-full rounded-full bg-${p.color}-500 transition-all`} style={{width: `${pct}%`}} />

                  </div>
                );
              })}
            </div>
          </div>
        </div>
      );
    };

    // ============================================
    // CALENDAR PANEL
    // ============================================
    const CalendarPanel = () => {
      const { timeEntries } = useData();
      const [viewMonth, setViewMonth] = useState(() => { const d = new Date(); return { year: d.getFullYear(), month: d.getMonth() }; });

      const hoursByDate = useMemo(() => {
        const h = {};
        timeEntries.forEach(e => { h[e.date] = (h[e.date]||0) + e.hours; });
        return h;
      }, [timeEntries]);

      const calendarDays = useMemo(() => {
        const first = new Date(viewMonth.year, viewMonth.month, 1);
        const startDay = first.getDay();
        const daysInMonth = new Date(viewMonth.year, viewMonth.month + 1, 0).getDate();
        const days = [];
        for (let i = 0; i < startDay; i++) days.push(null);
        for (let i = 1; i <= daysInMonth; i++) {
          const dateStr = `${viewMonth.year}-${String(viewMonth.month+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`;
          days.push({ day: i, date: dateStr, hours: hoursByDate[dateStr] || 0 });
        }
        return days;
      }, [viewMonth, hoursByDate]);

      const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
      const maxHours = Math.max(...calendarDays.filter(Boolean).map(d => d.hours), 1);

      const prevMonth = () => setViewMonth(p => p.month === 0 ? { year: p.year-1, month: 11 } : { ...p, month: p.month-1 });
      const nextMonth = () => setViewMonth(p => p.month === 11 ? { year: p.year+1, month: 0 } : { ...p, month: p.month+1 });

      return (
        <div className="space-y-4">
          <div className="flex items-center justify-between">
            <button onClick={prevMonth} className="w-8 h-8 rounded-lg bg-white/10 hover:bg-white/20 flex items-center justify-center">←</button>
            <span className="font-medium">{monthNames[viewMonth.month]} {viewMonth.year}</span>
            <button onClick={nextMonth} className="w-8 h-8 rounded-lg bg-white/10 hover:bg-white/20 flex items-center justify-center">→</button>
          </div>
          <div className="grid grid-cols-7 gap-1 text-center text-xs text-white/40 mb-2">
            {['Su','Mo','Tu','We','Th','Fr','Sa'].map(d => <div key={d}>{d}</div>)}
          </div>
          <div className="grid grid-cols-7 gap-1">
            {calendarDays.map((d, i) => (
              <div key={i} className={`aspect-square rounded-lg flex flex-col items-center justify-center text-xs transition-all ${
                d ? (d.hours > 0 ? 'bg-cyan-500/20 border border-cyan-500/30' : 'bg-white/5 border border-transparent') : ''
              } ${d && d.date === fmt(new Date()) ? 'ring-2 ring-cyan-400' : ''}`}>
                {d && (
                  <>
                    <span className="text-white/50">{d.day}</span>
                    {d.hours > 0 && <span className="font-mono text-cyan-400" style={{fontSize:'10px'}}>{d.hours.toFixed(1)}</span>}
                  </>
                )}
              </div>
            ))}
          </div>
        </div>
      );
    };

    // ============================================
    // IDEAS PANEL - Project-Linked Notes & Ideas
    // ============================================
    const IdeasPanel = () => {
      const { projects, notes, setNotes } = useData();
      const toast = useToast();
      const [selectedProjectId, setSelectedProjectId] = useState('all');
      const [newNote, setNewNote] = useState('');
      const [newNoteType, setNewNoteType] = useState('note');
      const [editingId, setEditingId] = useState(null);
      const [editText, setEditText] = useState('');

      const addIdea = () => {
        if (!newNote.trim()) return;
        if (selectedProjectId === 'all') { toast('Select a project first', 'error'); return; }
        const projectId = selectedProjectId;
        const project = projects.find(p => p.id === projectId);
        setNotes(prev => [...prev, {
          id: Date.now().toString(),
          content: newNote,
          type: newNoteType,
          projectId,
          projectName: project?.name || 'General',
          createdAt: new Date().toISOString(),
          done: false,
        }]);
        setNewNote('');
        toast('Added');
      };

      const deleteIdea = (id) => {
        setNotes(prev => prev.filter(n => n.id !== id));
        toast('Deleted');
      };

      const toggleDone = (id) => {
        setNotes(prev => prev.map(n => n.id === id ? { ...n, done: !n.done } : n));
      };

      const saveEdit = (id) => {
        setNotes(prev => prev.map(n => n.id === id ? { ...n, content: editText } : n));
        setEditingId(null);
        toast('Updated');
      };

      const filtered = useMemo(() => {
        return (notes || []).filter(n => selectedProjectId === 'all' || n.projectId === selectedProjectId)
          .sort((a,b) => {
            if (a.done !== b.done) return a.done ? 1 : -1;
            return new Date(b.createdAt) - new Date(a.createdAt);
          });
      }, [notes, selectedProjectId]);

      const typeIcons = { note: '📝', idea: '💡', action: '✅', decision: '⚖️', link: '🔗' };

      return (
        <div className="space-y-4">
          <div className="flex gap-2 overflow-x-auto pb-1">
            <button onClick={() => setSelectedProjectId('all')}
              className={`px-3 py-1.5 rounded-lg text-xs whitespace-nowrap transition-all ${selectedProjectId === 'all' ? 'bg-amber-500/20 text-amber-300 border border-amber-500/30' : 'bg-white/5 text-white/50 border border-transparent hover:bg-white/10'}`}>
              All
            </button>
            {projects.map(p => (
              <button key={p.id} onClick={() => setSelectedProjectId(p.id)}
                className={`px-3 py-1.5 rounded-lg text-xs whitespace-nowrap transition-all ${selectedProjectId === p.id ? 'bg-amber-500/20 text-amber-300 border border-amber-500/30' : 'bg-white/5 text-white/50 border border-transparent hover:bg-white/10'}`}>
                {p.name}
              </button>
            ))}
          </div>

          <div className="space-y-2">
            <div className="flex gap-1 mb-2">
              {Object.entries(typeIcons).map(([type, icon]) => (
                <button key={type} onClick={() => setNewNoteType(type)}
                  className={`px-2 py-1 rounded-lg text-xs transition-all ${newNoteType === type ? 'bg-white/15 border border-white/30' : 'bg-white/5 border border-transparent hover:bg-white/10'}`}>
                  {icon} {type}
                </button>
              ))}
            </div>
            <div className="flex gap-2">
              <input type="text" value={newNote} onChange={e => setNewNote(e.target.value)} placeholder={`Add ${newNoteType}...`}
                onKeyDown={e => e.key === 'Enter' && addIdea()}
                className="flex-1 bg-white/5 border border-white/10 rounded-xl px-4 py-2.5 focus-ring text-sm" />
              <button onClick={addIdea} className="px-4 py-2.5 bg-amber-500 hover:bg-amber-400 rounded-xl font-medium transition-colors text-sm">Add</button>
            </div>
          </div>

          <div className="space-y-2 max-h-96 overflow-y-auto">
            {filtered.length === 0 && <p className="text-center text-white/30 text-sm py-8">No notes yet for this project</p>}
            {filtered.map(n => (
              <div key={n.id} className={`p-3 rounded-xl bg-white/5 group hover:bg-white/8 transition-all ${n.done ? 'opacity-50' : ''}`}>
                {editingId === n.id ? (
                  <div className="flex gap-2">
                    <input type="text" value={editText} onChange={e => setEditText(e.target.value)} onKeyDown={e => e.key === 'Enter' && saveEdit(n.id)}
                      className="flex-1 bg-white/10 border border-white/20 rounded-lg px-3 py-1.5 text-sm focus-ring" autoFocus />
                    <button onClick={() => saveEdit(n.id)} className="text-xs px-2 py-1 bg-cyan-500/20 rounded-lg">Save</button>
                  </div>
                ) : (
                  <div className="flex items-start gap-2">
                    {n.type === 'action' && (
                      <button onClick={() => toggleDone(n.id)} className={`mt-0.5 w-5 h-5 rounded border flex items-center justify-center text-xs transition-all ${n.done ? 'bg-emerald-500/30 border-emerald-500 text-emerald-300' : 'border-white/20 hover:border-white/40'}`}>
                        {n.done && '✓'}
                      </button>
                    )}
                    <div className="flex-1 min-w-0">
                      <div className="flex items-center gap-2">
                        <span className="text-sm">{typeIcons[n.type] || '📝'}</span>
                        <span className={`text-sm ${n.done ? 'line-through text-white/40' : ''}`}>{n.content}</span>
                      </div>
                      <div className="text-xs text-white/30 mt-1">{n.projectName || 'General'} · {new Date(n.createdAt).toLocaleDateString()}</div>
                    </div>
                    <div className="flex gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
                      <button onClick={() => { setEditingId(n.id); setEditText(n.content); }} className="w-6 h-6 rounded bg-white/10 flex items-center justify-center text-xs">✏️</button>
                      <button onClick={() => deleteIdea(n.id)} className="w-6 h-6 rounded bg-red-500/20 flex items-center justify-center text-xs">✕</button>
                    </div>
                  </div>
                )}
              </div>
            ))}
          </div>
        </div>
      );
    };

    // ============================================
    // RENDER THE APP
    // ============================================
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
