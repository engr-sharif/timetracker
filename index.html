<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jacobs TimeTracker | Engineering Hours</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Outfit', sans-serif; overflow-x: hidden; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); border-radius: 3px; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.25); }

    .glass {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .glow-cyan { box-shadow: 0 0 40px rgba(34, 211, 238, 0.15); }
    .glow-emerald { box-shadow: 0 0 40px rgba(52, 211, 153, 0.15); }
    .glow-amber { box-shadow: 0 0 40px rgba(251, 191, 36, 0.15); }
    .glow-violet { box-shadow: 0 0 40px rgba(167, 139, 250, 0.15); }
    .glow-rose { box-shadow: 0 0 40px rgba(251, 113, 133, 0.15); }
    .glow-blue { box-shadow: 0 0 40px rgba(96, 165, 250, 0.15); }

    /* Theme backgrounds */
    .theme-dark {
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
      background-size: 400% 400%;
      animation: gradientShift 15s ease infinite;
    }
    .theme-midnight {
      background: linear-gradient(135deg, #0c1445 0%, #1a1a5e 50%, #0c1445 100%);
      background-size: 400% 400%;
      animation: gradientShift 15s ease infinite;
    }
    .theme-forest {
      background: linear-gradient(135deg, #0a1f0a 0%, #1a3a2a 50%, #0a1f0a 100%);
      background-size: 400% 400%;
      animation: gradientShift 15s ease infinite;
    }
    .theme-amber {
      background: linear-gradient(135deg, #1a1000 0%, #2a1f0a 50%, #1a1000 100%);
      background-size: 400% 400%;
      animation: gradientShift 15s ease infinite;
    }

    @keyframes gradientShift {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.4;
      animation: float 20s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(30px, -30px) scale(1.1); }
      66% { transform: translate(-20px, 20px) scale(0.9); }
    }

    .panel-enter { animation: panelIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
    @keyframes panelIn {
      from { opacity: 0; transform: scale(0.9) translateY(20px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .fade-in { animation: fadeIn 0.3s ease forwards; }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .slide-up { animation: slideUp 0.3s ease forwards; }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    input, select, textarea { font-family: 'Outfit', sans-serif; }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: rgba(34, 211, 238, 0.5);
      box-shadow: 0 0 0 3px rgba(34, 211, 238, 0.1);
    }

    .btn-glow:hover { box-shadow: 0 0 20px currentColor; }
    .drag-handle { cursor: grab; }
    .drag-handle:active { cursor: grabbing; }

    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    input[type="number"] { -moz-appearance: textfield; }

    .sync-indicator { transition: all 0.3s ease; }
    .sync-indicator.syncing { animation: pulse 1s infinite; }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    @keyframes timerPulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }
    .timer-pulse { animation: timerPulse 1.5s ease-in-out infinite; }

    /* Print styles */
    @media print {
      body { background: white !important; color: black !important; }
      .glass { background: white !important; backdrop-filter: none !important; border: 1px solid #ccc !important; box-shadow: none !important; }
      .no-print { display: none !important; }
      .print-only { display: block !important; }
    }
    .print-only { display: none; }

    /* Mobile responsive */
    @media (max-width: 768px) {
      .mobile-fullscreen {
        position: fixed !important;
        left: 0 !important;
        top: 60px !important;
        width: 100vw !important;
        min-height: calc(100vh - 60px) !important;
        border-radius: 0 !important;
        z-index: 100 !important;
      }
    }

    /* Autocomplete dropdown */
    .autocomplete-dropdown {
      position: absolute;
      z-index: 1000;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 12px;
      max-height: 200px;
      overflow-y: auto;
      backdrop-filter: blur(20px);
    }

    /* Toast notification */
    .toast {
      animation: toastIn 0.3s ease forwards;
    }
    .toast-exit {
      animation: toastOut 0.3s ease forwards;
    }
    @keyframes toastIn {
      from { opacity: 0; transform: translateY(20px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes toastOut {
      from { opacity: 1; transform: translateY(0) scale(1); }
      to { opacity: 0; transform: translateY(-20px) scale(0.95); }
    }

    /* CSS bar charts */
    .bar-chart-bar {
      transition: height 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* Calendar heat colors */
    .heat-0 { background: rgba(255,255,255,0.03); }
    .heat-1 { background: rgba(34,211,238,0.15); }
    .heat-2 { background: rgba(34,211,238,0.3); }
    .heat-3 { background: rgba(34,211,238,0.5); }
    .heat-4 { background: rgba(52,211,153,0.6); }
    .heat-5 { background: rgba(52,211,153,0.8); }

    /* Tag colors */
    .tag-fieldwork { background: rgba(251,191,36,0.2); color: #fbbf24; }
    .tag-office { background: rgba(96,165,250,0.2); color: #60a5fa; }
    .tag-review { background: rgba(167,139,250,0.2); color: #a78bfa; }
    .tag-meeting { background: rgba(52,211,153,0.2); color: #34d399; }
    .tag-design { background: rgba(251,113,133,0.2); color: #fb7185; }
    .tag-site { background: rgba(251,146,60,0.2); color: #fb923c; }
    .tag-default { background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.7); }

    /* Keyboard shortcut badge */
    .kbd {
      display: inline-block;
      padding: 2px 6px;
      font-size: 11px;
      font-family: 'JetBrains Mono', monospace;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 4px;
      color: rgba(255,255,255,0.6);
    }
  </style>
</head>
<body class="theme-dark min-h-screen text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback, useMemo, createContext, useContext, useReducer } = React;

    // ============================================
    // CONSTANTS & HELPERS
    // ============================================
    const GIST_FILENAME = 'jacobs-timetracker-data.json';
    const DAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
    const THEMES = {
      dark: { name: 'Dark', bg: 'theme-dark', accent: 'cyan' },
      midnight: { name: 'Midnight Blue', bg: 'theme-midnight', accent: 'blue' },
      forest: { name: 'Forest Green', bg: 'theme-forest', accent: 'emerald' },
      amber: { name: 'Warm Amber', bg: 'theme-amber', accent: 'amber' },
    };
    const TAG_PRESETS = ['fieldwork','office','review','meeting','design','site'];
    const TARGET_HOURS = 40;

    const fmt = (d) => d.toISOString().split('T')[0];
    const today = () => fmt(new Date());
    const parseDate = (s) => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };

    const getWeekDates = (refDate) => {
      const d = refDate ? new Date(refDate) : new Date();
      const day = d.getDay();
      const mon = new Date(d);
      mon.setDate(d.getDate() - (day === 0 ? 6 : day - 1));
      mon.setHours(0,0,0,0);
      return Array.from({length:7}, (_,i) => {
        const dt = new Date(mon);
        dt.setDate(mon.getDate()+i);
        return fmt(dt);
      });
    };

    const getMonthDates = (year, month) => {
      const first = new Date(year, month, 1);
      const last = new Date(year, month+1, 0);
      const dates = [];
      for (let d = new Date(first); d <= last; d.setDate(d.getDate()+1)) {
        dates.push(fmt(new Date(d)));
      }
      return dates;
    };

    const formatDuration = (ms) => {
      const s = Math.floor(ms/1000);
      const h = Math.floor(s/3600);
      const m = Math.floor((s%3600)/60);
      const sec = s%60;
      return `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${sec.toString().padStart(2,'0')}`;
    };

    const msToHours = (ms) => Math.round((ms/3600000)*4)/4; // round to 0.25

    // ============================================
    // GITHUB GIST STORAGE
    // ============================================
    const GistStorage = {
      async loadData(token, gistId) {
        try {
          const res = await fetch(`https://api.github.com/gists/${gistId}`, { headers: { 'Authorization': `token ${token}` } });
          if (!res.ok) throw new Error('Failed to load gist');
          const gist = await res.json();
          const content = gist.files[GIST_FILENAME]?.content;
          return content ? JSON.parse(content) : null;
        } catch (e) { console.error('Load error:', e); return null; }
      },
      async saveData(token, gistId, data) {
        try {
          const res = await fetch(`https://api.github.com/gists/${gistId}`, {
            method: 'PATCH',
            headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({ files: { [GIST_FILENAME]: { content: JSON.stringify(data, null, 2) } } })
          });
          return res.ok;
        } catch (e) { console.error('Save error:', e); return false; }
      },
      async createGist(token) {
        try {
          const res = await fetch('https://api.github.com/gists', {
            method: 'POST',
            headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({ description: 'Jacobs TimeTracker Data', public: false, files: { [GIST_FILENAME]: { content: JSON.stringify({ projects: [], timeEntries: [], notes: [], templates: [], tags: [] }, null, 2) } } })
          });
          if (!res.ok) throw new Error('Failed to create gist');
          return (await res.json()).id;
        } catch (e) { console.error('Create gist error:', e); return null; }
      },
      async validateToken(token) {
        try {
          const res = await fetch('https://api.github.com/user', { headers: { 'Authorization': `token ${token}` } });
          return res.ok ? await res.json() : null;
        } catch (e) { return null; }
      }
    };

    // ============================================
    // PASSWORD HASHING
    // ============================================
    const hashPassword = async (pw) => {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(pw));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
    };

    // ============================================
    // TOAST SYSTEM
    // ============================================
    const ToastContext = createContext();
    const ToastProvider = ({ children }) => {
      const [toasts, setToasts] = useState([]);
      const addToast = useCallback((msg, type='success') => {
        const id = Date.now();
        setToasts(p => [...p, { id, msg, type }]);
        setTimeout(() => setToasts(p => p.filter(t => t.id !== id)), 3000);
      }, []);
      return (
        <ToastContext.Provider value={addToast}>
          {children}
          <div className="fixed bottom-6 right-6 z-[9999] space-y-2">
            {toasts.map(t => (
              <div key={t.id} className={`toast glass rounded-xl px-5 py-3 text-sm flex items-center gap-2 ${t.type === 'error' ? 'border-red-500/30' : t.type === 'warning' ? 'border-amber-500/30' : 'border-emerald-500/30'}`}>
                <span>{t.type === 'error' ? '❌' : t.type === 'warning' ? '⚠️' : '✅'}</span>
                <span>{t.msg}</span>
              </div>
            ))}
          </div>
        </ToastContext.Provider>
      );
    };
    const useToast = () => useContext(ToastContext);

    // ============================================
    // THEME CONTEXT
    // ============================================
    const ThemeContext = createContext();
    const ThemeProvider = ({ children }) => {
      const [theme, setTheme] = useState(() => localStorage.getItem('jtt_theme') || 'dark');
      useEffect(() => {
        localStorage.setItem('jtt_theme', theme);
        document.body.className = `${THEMES[theme].bg} min-h-screen text-white`;
      }, [theme]);
      return <ThemeContext.Provider value={{ theme, setTheme }}>{children}</ThemeContext.Provider>;
    };
    const useTheme = () => useContext(ThemeContext);

    // ============================================
    // UNDO SYSTEM
    // ============================================
    const UndoContext = createContext();
    const UndoProvider = ({ children }) => {
      const [undoStack, setUndoStack] = useState([]);
      const pushUndo = useCallback((action) => {
        setUndoStack(p => [...p.slice(-19), action]);
      }, []);
      const popUndo = useCallback(() => {
        let action = null;
        setUndoStack(p => {
          if (p.length === 0) return p;
          action = p[p.length-1];
          return p.slice(0,-1);
        });
        return action;
      }, []);
      return <UndoContext.Provider value={{ pushUndo, popUndo, hasUndo: undoStack.length > 0 }}>{children}</UndoContext.Provider>;
    };
    const useUndo = () => useContext(UndoContext);

    // ============================================
    // DATA CONTEXT
    // ============================================
    const DataContext = createContext();

    const defaultProjects = [
      { id: '1', name: 'Highway 101 Expansion', number: 'P-2024-0847', costCodes: ['001-Design', '002-Review', '003-Meetings'], color: 'cyan' },
      { id: '2', name: 'Bay Area Transit Hub', number: 'P-2024-1203', costCodes: ['001-Planning', '002-Analysis', '003-Documentation'], color: 'emerald' },
    ];

    const DataProvider = ({ children, authInfo }) => {
      const [projects, setProjects] = useState(defaultProjects);
      const [timeEntries, setTimeEntries] = useState([]);
      const [notes, setNotes] = useState([]);
      const [templates, setTemplates] = useState([]);
      const [syncStatus, setSyncStatus] = useState('idle');
      const [lastSync, setLastSync] = useState(null);
      const saveTimeout = useRef(null);
      const isInitialized = useRef(false);

      useEffect(() => {
        const load = async () => {
          if (!authInfo?.token || !authInfo?.gistId) return;
          setSyncStatus('syncing');
          const data = await GistStorage.loadData(authInfo.token, authInfo.gistId);
          if (data) {
            if (data.projects?.length) setProjects(data.projects);
            if (data.timeEntries) setTimeEntries(data.timeEntries);
            if (data.notes) setNotes(data.notes);
            if (data.templates) setTemplates(data.templates);
          }
          setSyncStatus('synced');
          setLastSync(new Date());
          isInitialized.current = true;
        };
        load();
      }, [authInfo]);

      const saveToGist = useCallback(async (data) => {
        if (!authInfo?.token || !authInfo?.gistId || !isInitialized.current) return;
        setSyncStatus('syncing');
        const ok = await GistStorage.saveData(authInfo.token, authInfo.gistId, data);
        setSyncStatus(ok ? 'synced' : 'error');
        if (ok) setLastSync(new Date());
      }, [authInfo]);

      useEffect(() => {
        if (!isInitialized.current) return;
        if (saveTimeout.current) clearTimeout(saveTimeout.current);
        saveTimeout.current = setTimeout(() => {
          saveToGist({ projects, timeEntries, notes, templates });
        }, 1500);
        return () => clearTimeout(saveTimeout.current);
      }, [projects, timeEntries, notes, templates, saveToGist]);

      const weekDates = useMemo(() => getWeekDates(), []);

      const weeklyHours = useMemo(() =>
        timeEntries.filter(e => weekDates.includes(e.date)).reduce((s,e) => s + e.hours, 0),
      [timeEntries, weekDates]);

      const addTimeEntry = useCallback((entry) => {
        const newEntry = { ...entry, id: Date.now().toString(), createdAt: new Date().toISOString() };
        setTimeEntries(prev => [...prev, newEntry]);
        return newEntry;
      }, []);

      const updateTimeEntry = useCallback((id, updates) => {
        setTimeEntries(prev => prev.map(e => e.id === id ? { ...e, ...updates } : e));
      }, []);

      const deleteTimeEntry = useCallback((id) => {
        let deleted = null;
        setTimeEntries(prev => {
          deleted = prev.find(e => e.id === id);
          return prev.filter(e => e.id !== id);
        });
        return deleted;
      }, []);

      const bulkDeleteEntries = useCallback((ids) => {
        let deleted = [];
        setTimeEntries(prev => {
          deleted = prev.filter(e => ids.includes(e.id));
          return prev.filter(e => !ids.includes(e.id));
        });
        return deleted;
      }, []);

      const addProject = useCallback((project) => {
        setProjects(prev => [...prev, { ...project, id: Date.now().toString() }]);
      }, []);

      const deleteProject = useCallback((id) => {
        setProjects(prev => prev.filter(p => p.id !== id));
      }, []);

      const addNote = useCallback((note) => {
        setNotes(prev => [...prev, { ...note, id: Date.now().toString(), createdAt: new Date().toISOString() }]);
      }, []);

      const deleteNote = useCallback((id) => {
        setNotes(prev => prev.filter(n => n.id !== id));
      }, []);

      const addTemplate = useCallback((tpl) => {
        setTemplates(prev => [...prev, { ...tpl, id: Date.now().toString() }]);
      }, []);

      const deleteTemplate = useCallback((id) => {
        setTemplates(prev => prev.filter(t => t.id !== id));
      }, []);

      const forceSync = useCallback(() => {
        saveToGist({ projects, timeEntries, notes, templates });
      }, [projects, timeEntries, notes, templates, saveToGist]);

      // Descriptions for autocomplete
      const allDescriptions = useMemo(() => {
        const descs = [...new Set(timeEntries.map(e => e.description).filter(Boolean))];
        return descs.slice(-50);
      }, [timeEntries]);

      return (
        <DataContext.Provider value={{
          projects, setProjects, addProject, deleteProject,
          timeEntries, setTimeEntries, addTimeEntry, updateTimeEntry, deleteTimeEntry, bulkDeleteEntries,
          notes, addNote, deleteNote,
          templates, addTemplate, deleteTemplate,
          weekDates, weeklyHours,
          syncStatus, lastSync, forceSync,
          user: authInfo?.user,
          allDescriptions,
        }}>
          {children}
        </DataContext.Provider>
      );
    };

    const useData = () => useContext(DataContext);

    // ============================================
    // SYNC INDICATOR
    // ============================================
    const SyncIndicator = () => {
      const { syncStatus, lastSync, forceSync } = useData();
      const cfg = {
        idle: { color: 'text-white/30', icon: '○', label: 'Not synced' },
        syncing: { color: 'text-cyan-400', icon: '↻', label: 'Syncing...' },
        synced: { color: 'text-emerald-400', icon: '✓', label: 'Synced' },
        error: { color: 'text-red-400', icon: '✗', label: 'Error' }
      }[syncStatus];
      return (
        <button onClick={forceSync} className={`flex items-center gap-2 px-3 py-1.5 rounded-lg bg-white/5 hover:bg-white/10 transition-colors ${cfg.color}`}
          title={lastSync ? `Last: ${lastSync.toLocaleTimeString()}` : 'Click to sync'}>
          <span className={`sync-indicator ${syncStatus === 'syncing' ? 'syncing' : ''}`}>{cfg.icon}</span>
          <span className="text-xs hidden sm:inline">{cfg.label}</span>
        </button>
      );
    };

    // ============================================
    // FLOATING PANEL (Physics-based draggable)
    // ============================================
    const FloatingPanel = ({ children, title, icon, defaultPosition = {x:100,y:100}, glowColor='cyan', onClose, width=400, minHeight=200, zIndex=10, panelId }) => {
      const isMobile = window.innerWidth < 768;
      const [position, setPosition] = useState(isMobile ? {x:0,y:60} : defaultPosition);
      const [velocity, setVelocity] = useState({x:0,y:0});
      const [isDragging, setIsDragging] = useState(false);
      const [isVisible, setIsVisible] = useState(true);
      const [isMinimized, setIsMinimized] = useState(false);
      const panelRef = useRef(null);
      const dragStart = useRef({x:0,y:0});
      const lastPos = useRef({x:0,y:0});
      const animFrame = useRef(null);

      const friction = 0.92, bounce = 0.6;

      useEffect(() => {
        if (isMobile || isDragging) return;
        if (Math.abs(velocity.x) > 0.1 || Math.abs(velocity.y) > 0.1) {
          animFrame.current = requestAnimationFrame(() => {
            const nv = { x: velocity.x*friction, y: velocity.y*friction };
            let np = { x: position.x+nv.x, y: position.y+nv.y };
            const maxX = window.innerWidth - width - 20, maxY = window.innerHeight - 100;
            if (np.x < 20) { np.x = 20; nv.x = -nv.x*bounce; }
            if (np.x > maxX) { np.x = maxX; nv.x = -nv.x*bounce; }
            if (np.y < 20) { np.y = 20; nv.y = -nv.y*bounce; }
            if (np.y > maxY) { np.y = maxY; nv.y = -nv.y*bounce; }
            setPosition(np);
            setVelocity(nv);
          });
        }
        return () => cancelAnimationFrame(animFrame.current);
      }, [isDragging, velocity, position, width, isMobile]);

      const handlePointerDown = (e) => {
        if (isMobile) return;
        if (e.target.closest('input, button, select, textarea, a')) return;
        setIsDragging(true);
        dragStart.current = { x: e.clientX - position.x, y: e.clientY - position.y };
        lastPos.current = { x: e.clientX, y: e.clientY };
      };

      useEffect(() => {
        if (!isDragging) return;
        const move = (e) => {
          const np = { x: e.clientX - dragStart.current.x, y: e.clientY - dragStart.current.y };
          const nv = { x: e.clientX - lastPos.current.x, y: e.clientY - lastPos.current.y };
          lastPos.current = { x: e.clientX, y: e.clientY };
          setPosition(np);
          setVelocity(nv);
        };
        const up = () => setIsDragging(false);
        window.addEventListener('mousemove', move);
        window.addEventListener('mouseup', up);
        return () => { window.removeEventListener('mousemove', move); window.removeEventListener('mouseup', up); };
      }, [isDragging]);

      if (!isVisible) return null;

      const glowClasses = {
        cyan: 'glow-cyan border-cyan-500/30',
        emerald: 'glow-emerald border-emerald-500/30',
        amber: 'glow-amber border-amber-500/30',
        violet: 'glow-violet border-violet-500/30',
        rose: 'glow-rose border-rose-500/30',
        blue: 'glow-blue border-blue-500/30',
      };

      return (
        <div ref={panelRef}
          className={`fixed glass rounded-2xl panel-enter ${glowClasses[glowColor]} transition-shadow duration-300 ${isMobile ? 'mobile-fullscreen' : ''}`}
          style={isMobile ? {} : { left: position.x, top: position.y, width, minHeight: isMinimized ? 'auto' : minHeight, zIndex, transform: isDragging ? 'scale(1.02)' : 'scale(1)', transition: isDragging ? 'none' : 'transform 0.2s ease' }}>
          <div className="drag-handle flex items-center justify-between px-5 py-3 border-b border-white/5" onMouseDown={handlePointerDown}>
            <div className="flex items-center gap-3">
              <span className="text-lg">{icon}</span>
              <h2 className="font-semibold text-white/90 text-sm">{title}</h2>
            </div>
            <div className="flex items-center gap-1">
              {!isMobile && (
                <button onClick={() => setIsMinimized(!isMinimized)} className="w-7 h-7 rounded-lg bg-white/5 hover:bg-white/10 flex items-center justify-center transition-colors">
                  <span className="text-white/50 text-xs">{isMinimized ? '▼' : '▲'}</span>
                </button>
              )}
              <button onClick={() => { setIsVisible(false); onClose?.(); }} className="w-7 h-7 rounded-lg bg-white/5 hover:bg-red-500/20 flex items-center justify-center transition-colors">
                <svg className="w-3.5 h-3.5 text-white/50 hover:text-red-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" /></svg>
              </button>
            </div>
          </div>
          {!isMinimized && <div className="p-5 overflow-y-auto" style={{ maxHeight: isMobile ? 'calc(100vh - 120px)' : 'calc(80vh - 60px)' }}>{children}</div>}
        </div>
      );
    };

    // ============================================
    // AUTOCOMPLETE INPUT
    // ============================================
    const AutocompleteInput = ({ value, onChange, suggestions, placeholder, className }) => {
      const [show, setShow] = useState(false);
      const [filtered, setFiltered] = useState([]);
      const ref = useRef(null);

      useEffect(() => {
        if (value && show) {
          setFiltered(suggestions.filter(s => s.toLowerCase().includes(value.toLowerCase())).slice(0,5));
        } else {
          setFiltered([]);
        }
      }, [value, suggestions, show]);

      return (
        <div className="relative" ref={ref}>
          <input type="text" value={value} onChange={(e) => onChange(e.target.value)}
            onFocus={() => setShow(true)} onBlur={() => setTimeout(() => setShow(false), 200)}
            placeholder={placeholder} className={className} />
          {filtered.length > 0 && show && (
            <div className="autocomplete-dropdown mt-1 w-full">
              {filtered.map((s,i) => (
                <div key={i} className="px-4 py-2 hover:bg-white/10 cursor-pointer text-sm" onMouseDown={() => { onChange(s); setShow(false); }}>{s}</div>
              ))}
            </div>
          )}
        </div>
      );
    };

    // ============================================
    // TAG SELECTOR
    // ============================================
    const TagSelector = ({ selected = [], onChange }) => {
      const [custom, setCustom] = useState('');
      const toggle = (tag) => {
        onChange(selected.includes(tag) ? selected.filter(t => t !== tag) : [...selected, tag]);
      };
      const addCustom = () => {
        if (custom && !selected.includes(custom)) {
          onChange([...selected, custom.toLowerCase()]);
          setCustom('');
        }
      };
      return (
        <div className="flex flex-wrap gap-1.5">
          {TAG_PRESETS.map(tag => (
            <button key={tag} onClick={() => toggle(tag)}
              className={`text-xs px-2.5 py-1 rounded-lg transition-all ${selected.includes(tag) ? `tag-${tag} border border-current/30` : 'bg-white/5 text-white/40 hover:bg-white/10'}`}>
              {tag}
            </button>
          ))}
          <div className="flex gap-1">
            <input type="text" value={custom} onChange={e => setCustom(e.target.value)}
              onKeyDown={e => e.key === 'Enter' && addCustom()}
              placeholder="+" className="w-16 text-xs bg-white/5 border border-white/10 rounded-lg px-2 py-1" />
          </div>
        </div>
      );
    };

    // ============================================
    // LIVE TIMER
    // ============================================
    const LiveTimer = () => {
      const { projects, addTimeEntry } = useData();
      const toast = useToast();
      const [timerState, setTimerState] = useState(() => {
        const saved = localStorage.getItem('jtt_timer');
        return saved ? JSON.parse(saved) : { running: false, paused: false, startTime: null, pausedElapsed: 0, projectId: '', costCode: '', description: '' };
      });
      const [elapsed, setElapsed] = useState(0);
      const intervalRef = useRef(null);

      useEffect(() => {
        localStorage.setItem('jtt_timer', JSON.stringify(timerState));
      }, [timerState]);

      useEffect(() => {
        if (timerState.running && !timerState.paused) {
          intervalRef.current = setInterval(() => {
            setElapsed(Date.now() - timerState.startTime + timerState.pausedElapsed);
          }, 1000);
        } else if (timerState.paused) {
          setElapsed(timerState.pausedElapsed);
        } else {
          setElapsed(0);
        }
        return () => clearInterval(intervalRef.current);
      }, [timerState.running, timerState.paused, timerState.startTime, timerState.pausedElapsed]);

      const start = () => {
        setTimerState(p => ({ ...p, running: true, paused: false, startTime: Date.now(), pausedElapsed: 0 }));
      };
      const pause = () => {
        const el = Date.now() - timerState.startTime + timerState.pausedElapsed;
        setTimerState(p => ({ ...p, paused: true, pausedElapsed: el }));
      };
      const resume = () => {
        setTimerState(p => ({ ...p, paused: false, startTime: Date.now() }));
      };
      const stop = () => {
        if (elapsed < 60000) { toast('Timer too short (< 1 min)', 'warning'); return; }
        const project = projects.find(p => p.id === timerState.projectId);
        if (!timerState.projectId || !timerState.costCode) { toast('Select project and cost code first', 'warning'); return; }
        const hours = msToHours(elapsed);
        addTimeEntry({
          projectId: timerState.projectId, projectName: project?.name || '', projectNumber: project?.number || '',
          costCode: timerState.costCode, hours, date: today(), description: timerState.description || 'Timer entry', tags: []
        });
        toast(`Logged ${hours}h from timer`);
        setTimerState({ running: false, paused: false, startTime: null, pausedElapsed: 0, projectId: '', costCode: '', description: '' });
      };
      const discard = () => {
        setTimerState({ running: false, paused: false, startTime: null, pausedElapsed: 0, projectId: timerState.projectId, costCode: timerState.costCode, description: timerState.description });
      };

      const currentProject = projects.find(p => p.id === timerState.projectId);

      return (
        <div className="space-y-4">
          <div className="text-center py-4">
            <div className={`text-4xl font-mono font-bold ${timerState.running && !timerState.paused ? 'text-emerald-400 timer-pulse' : timerState.paused ? 'text-amber-400' : 'text-white/30'}`}>
              {formatDuration(elapsed)}
            </div>
            {elapsed > 0 && <div className="text-xs text-white/40 mt-1">{msToHours(elapsed)}h</div>}
          </div>

          <div className="flex gap-2 justify-center">
            {!timerState.running ? (
              <button onClick={start} className="px-6 py-2.5 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-white font-medium transition-colors">▶ Start</button>
            ) : timerState.paused ? (
              <>
                <button onClick={resume} className="px-5 py-2.5 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-white font-medium transition-colors">▶ Resume</button>
                <button onClick={stop} className="px-5 py-2.5 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-white font-medium transition-colors">⏹ Save</button>
                <button onClick={discard} className="px-4 py-2.5 rounded-xl bg-red-500/20 hover:bg-red-500/30 text-red-400 transition-colors">✕</button>
              </>
            ) : (
              <>
                <button onClick={pause} className="px-5 py-2.5 rounded-xl bg-amber-500 hover:bg-amber-400 text-white font-medium transition-colors">⏸ Pause</button>
                <button onClick={stop} className="px-5 py-2.5 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-white font-medium transition-colors">⏹ Save</button>
              </>
            )}
          </div>

          <div className="space-y-3 pt-2">
            <select value={timerState.projectId} onChange={e => setTimerState(p => ({...p, projectId: e.target.value, costCode: ''}))}
              className="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-2.5 text-sm">
              <option value="">Select project...</option>
              {projects.map(p => <option key={p.id} value={p.id}>{p.number} - {p.name}</option>)}
            </select>
            {currentProject && (
              <select value={timerState.costCode} onChange={e => setTimerState(p => ({...p, costCode: e.target.value}))}
                className="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-2.5 text-sm">
                <option value="">Select cost code...</option>
                {currentProject.costCodes.map(c => <option key={c} value={c}>{c}</option>)}
              </select>
            )}
            <input type="text" value={timerState.description} onChange={e => setTimerState(p => ({...p, description: e.target.value}))}
              placeholder="What are you working on?" className="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-2.5 text-sm" />
          </div>
        </div>
      );
    };

    // ============================================
    // QUICK ENTRY
    // ============================================
    const QuickEntry = () => {
      const { projects, addTimeEntry, allDescriptions } = useData();
      const { pushUndo } = useUndo();
      const toast = useToast();
      const [projectId, setProjectId] = useState('');
      const [costCode, setCostCode] = useState('');
      const [hours, setHours] = useState('');
      const [date, setDate] = useState(today());
      const [description, setDescription] = useState('');
      const [tags, setTags] = useState([]);

      const project = projects.find(p => p.id === projectId);
      const quickHours = [0.5, 1, 2, 4, 8];

      const handleSubmit = () => {
        if (!projectId || !costCode || !hours) return;
        const entry = addTimeEntry({
          projectId, projectName: project.name, projectNumber: project.number,
          costCode, hours: parseFloat(hours), date, description, tags
        });
        pushUndo({ type: 'addEntry', entry });
        toast(`Logged ${hours}h to ${project.name}`);
        setHours(''); setDescription(''); setTags([]);
      };

      return (
        <div className="space-y-4">
          <div>
            <label className="block text-xs text-white/50 mb-2 uppercase tracking-wider">Project</label>
            <select value={projectId} onChange={e => { setProjectId(e.target.value); setCostCode(''); }}
              className="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-white">
              <option value="">Select project...</option>
              {projects.map(p => <option key={p.id} value={p.id}>{p.number} - {p.name}</option>)}
            </select>
          </div>

          {project && (
            <div className="slide-up">
              <label className="block text-xs text-white/50 mb-2 uppercase tracking-wider">Cost Code</label>
              <div className="grid grid-cols-1 gap-2">
                {project.costCodes.map(code => (
                  <button key={code} onClick={() => setCostCode(code)}
                    className={`px-4 py-2.5 rounded-xl text-left transition-all border ${costCode === code ? 'bg-cyan-500/20 border-cyan-500/50 text-cyan-300' : 'bg-white/5 border-white/10 hover:bg-white/10'}`}>
                    <span className="font-mono text-sm">{code}</span>
                  </button>
                ))}
              </div>
            </div>
          )}

          {costCode && (
            <div className="slide-up">
              <label className="block text-xs text-white/50 mb-2 uppercase tracking-wider">Hours</label>
              <div className="flex gap-2 mb-3">
                {quickHours.map(h => (
                  <button key={h} onClick={() => setHours(h.toString())}
                    className={`flex-1 py-2 rounded-xl font-mono text-sm transition-all border ${hours === h.toString() ? 'bg-emerald-500/20 border-emerald-500/50 text-emerald-300' : 'bg-white/5 border-white/10 hover:bg-white/10'}`}>{h}h</button>
                ))}
              </div>
              <input type="number" value={hours} onChange={e => setHours(e.target.value)} placeholder="Custom hours..." step="0.25" min="0" max="24"
                className="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-2.5 font-mono" />
              {hours && <div className="text-xs text-white/40 mt-1">Running total today: {hours}h</div>}
            </div>
          )}

          {hours && (
            <>
              <div className="slide-up">
                <label className="block text-xs text-white/50 mb-2 uppercase tracking-wider">Date</label>
                <input type="date" value={date} onChange={e => setDate(e.target.value)}
                  className="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-2.5" />
              </div>
              <div className="slide-up">
                <label className="block text-xs text-white/50 mb-2 uppercase tracking-wider">Description</label>
                <AutocompleteInput value={description} onChange={setDescription} suggestions={allDescriptions}
                  placeholder="What did you work on?" className="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-2.5" />
              </div>
              <div className="slide-up">
                <label className="block text-xs text-white/50 mb-2 uppercase tracking-wider">Tags</label>
                <TagSelector selected={tags} onChange={setTags} />
              </div>
              <button onClick={handleSubmit} disabled={!projectId || !costCode || !hours}
                className="w-full py-4 rounded-xl font-semibold transition-all bg-gradient-to-r from-cyan-500 to-emerald-500 hover:from-cyan-400 hover:to-emerald-400 text-white btn-glow slide-up">
                Log {hours} Hours
              </button>
            </>
          )}
        </div>
      );
    };

    // ============================================
    // WEEKLY TIMESHEET
    // ============================================
    const WeeklyTimesheet = () => {
      const { timeEntries, weekDates, deleteTimeEntry, weeklyHours } = useData();
      const { pushUndo } = useUndo();
      const toast = useToast();
      const [selectedIds, setSelectedIds] = useState(new Set());
      const todayStr = today();

      const entriesByDay = useMemo(() => {
        const g = {};
        weekDates.forEach(d => { g[d] = []; });
        timeEntries.forEach(e => { if (g[e.date]) g[e.date].push(e); });
        return g;
      }, [timeEntries, weekDates]);

      const hoursByDay = useMemo(() => {
        const h = {};
        weekDates.forEach(d => { h[d] = entriesByDay[d].reduce((s,e) => s+e.hours, 0); });
        return h;
      }, [entriesByDay, weekDates]);

      const utilization = Math.min(100, Math.round((weeklyHours / TARGET_HOURS) * 100));

      const handleDelete = (id) => {
        const deleted = deleteTimeEntry(id);
        if (deleted) {
          pushUndo({ type: 'deleteEntry', entry: deleted });
          toast('Entry deleted (Ctrl+Z to undo)');
        }
      };

      const toggleSelect = (id) => {
        setSelectedIds(prev => {
          const n = new Set(prev);
          n.has(id) ? n.delete(id) : n.add(id);
          return n;
        });
      };

      return (
        <div className="space-y-4">
          <div className="flex items-center justify-between p-4 rounded-xl bg-gradient-to-r from-cyan-500/10 to-emerald-500/10 border border-cyan-500/20">
            <div>
              <span className="text-white/70 text-sm">Weekly Total</span>
              <div className="text-2xl font-bold font-mono text-cyan-300">{weeklyHours.toFixed(1)}h</div>
            </div>
            <div className="text-right">
              <div className="text-xs text-white/50">Utilization</div>
              <div className={`text-lg font-bold font-mono ${utilization >= 100 ? 'text-emerald-400' : utilization >= 75 ? 'text-amber-400' : 'text-red-400'}`}>{utilization}%</div>
              <div className="w-24 h-1.5 bg-white/10 rounded-full mt-1">
                <div className={`h-full rounded-full transition-all ${utilization >= 100 ? 'bg-emerald-400' : utilization >= 75 ? 'bg-amber-400' : 'bg-red-400'}`} style={{width: `${Math.min(100, utilization)}%`}} />
              </div>
            </div>
          </div>

          <div className="grid grid-cols-7 gap-1">
            {weekDates.map((date, i) => (
              <div key={date} className="text-center">
                <div className="text-xs text-white/40 mb-1">{DAYS[i]}</div>
                <div className={`text-xs mb-1 ${date === todayStr ? 'text-cyan-400 font-bold' : 'text-white/60'}`}>{new Date(date+'T12:00:00').getDate()}</div>
                <div className={`text-sm font-mono font-semibold ${hoursByDay[date] >= 8 ? 'text-emerald-400' : hoursByDay[date] > 0 ? 'text-amber-400' : 'text-white/30'}`}>
                  {hoursByDay[date] || '-'}
                </div>
              </div>
            ))}
          </div>

          <div>
            <h3 className="text-xs text-white/50 uppercase tracking-wider mb-3">This Week's Entries</h3>
            <div className="space-y-2 max-h-64 overflow-y-auto">
              {timeEntries.filter(e => weekDates.includes(e.date)).reverse().map(entry => (
                <div key={entry.id} className="flex items-center gap-2 p-3 rounded-xl bg-white/5 group hover:bg-white/8 transition-colors">
                  <input type="checkbox" checked={selectedIds.has(entry.id)} onChange={() => toggleSelect(entry.id)}
                    className="w-3.5 h-3.5 rounded opacity-0 group-hover:opacity-100 transition-opacity" />
                  <div className="flex-1 min-w-0">
                    <div className="text-sm font-medium truncate">{entry.projectName}</div>
                    <div className="flex items-center gap-2">
                      <span className="text-xs text-white/50 font-mono">{entry.costCode}</span>
                      {entry.tags?.map(t => <span key={t} className={`text-[10px] px-1.5 py-0.5 rounded tag-${TAG_PRESETS.includes(t)?t:'default'}`}>{t}</span>)}
                    </div>
                    {entry.description && <div className="text-xs text-white/40 truncate mt-0.5">{entry.description}</div>}
                  </div>
                  <div className="flex items-center gap-2">
                    <div className="text-right">
                      <span className="font-mono text-emerald-400 text-sm">{entry.hours}h</span>
                      <div className="text-[10px] text-white/30">{entry.date.slice(5)}</div>
                    </div>
                    <button onClick={() => handleDelete(entry.id)}
                      className="opacity-0 group-hover:opacity-100 w-6 h-6 rounded bg-red-500/20 flex items-center justify-center transition-opacity">
                      <svg className="w-3 h-3 text-red-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" /></svg>
                    </button>
                  </div>
                </div>
              ))}
              {timeEntries.filter(e => weekDates.includes(e.date)).length === 0 && (
                <div className="text-center text-white/30 py-8">
                  <div className="text-3xl mb-2">📋</div>
                  <p className="text-sm">No entries this week</p>
                  <p className="text-xs text-white/20 mt-1">Use Quick Entry or Timer to get started</p>
                </div>
              )}
            </div>
          </div>
        </div>
      );
    };

                  <svg className="w-4 h-4 text-red-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>

              <input type="text" value={newProject.name} onChange={e => setNewProject({...newProject, name: e.target.value})}
                placeholder="Project Name" className="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-2.5" />
              <input type="text" value={newProject.costCodes} onChange={e => setNewProject({...newProject, costCodes: e.target.value})}
                placeholder="Cost Codes (comma separated)" className="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-2.5" />
              <div className="flex gap-2">
                <button onClick={handleAdd} className="flex-1 py-2.5 rounded-xl bg-cyan-500 text-white font-medium hover:bg-cyan-400 transition-colors">Add Project</button>
                <button onClick={() => setIsAdding(false)} className="px-4 py-2.5 rounded-xl bg-white/10 hover:bg-white/20 transition-colors">Cancel</button>
              </div>
            </div>
          ) : (
            <button onClick={() => setIsAdding(true)} className="w-full py-3 rounded-xl border-2 border-dashed border-white/20 text-white/50 hover:border-cyan-500/50 hover:text-cyan-400 transition-colors">+ Add New Project</button>
          )}
        </div>
      );
    };

    // ============================================
    // NOTES PANEL
    // ============================================
    const NotesPanel = () => {
      const { notes, addNote, deleteNote, projects } = useData();
      const [newNote, setNewNote] = useState('');
      const [selectedProject, setSelectedProject] = useState('');

      const handleAdd = () => {
        if (!newNote.trim()) return;
        addNote({ content: newNote, projectId: selectedProject || null, projectName: projects.find(p => p.id === selectedProject)?.name || null });
        setNewNote('');

      return (

              className="w-full bg-white/5 border border-white/10 rounded-xl px-3 py-2 text-sm">
              <option value="">General Note</option>
              {projects.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}

            <div className="flex gap-2">
              <input type="text" value={newNote} onChange={e => setNewNote(e.target.value)} onKeyDown={e => e.key === 'Enter' && handleAdd()}
                placeholder="Quick note..." className="flex-1 bg-white/5 border border-white/10 rounded-xl px-4 py-2.5" />

            </div>

          <div className="space-y-2 max-h-80 overflow-y-auto">
            {notes.slice().reverse().map(note => (
              <div key={note.id} className="p-3 rounded-xl bg-white/5 group">

                  </div>
