                    className="opacity-0 group-hover:opacity-100 w-6 h-6 rounded bg-red-500/20 flex items-center justify-center transition-opacity flex-shrink-0">
                    <svg className="w-3 h-3 text-red-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" /></svg>
                  </button>
                </div>
              </div>
            ))}
            {notes.length === 0 && <div className="text-center text-white/30 py-8"><div className="text-3xl mb-2">📝</div><p className="text-sm">No notes yet</p></div>}
          </div>
        </div>
      );
    };

    // ============================================
    // ANALYTICS DASHBOARD
    // ============================================
    const AnalyticsDashboard = () => {
      const { timeEntries, projects, weekDates } = useData();

      const now = new Date();
      const thisMonth = now.getMonth();
      const thisYear = now.getFullYear();
      const lastMonth = thisMonth === 0 ? 11 : thisMonth - 1;
      const lastMonthYear = thisMonth === 0 ? thisYear - 1 : thisYear;

      const thisMonthEntries = timeEntries.filter(e => { const d = parseDate(e.date); return d.getMonth() === thisMonth && d.getFullYear() === thisYear; });
      const lastMonthEntries = timeEntries.filter(e => { const d = parseDate(e.date); return d.getMonth() === lastMonth && d.getFullYear() === lastMonthYear; });
      const weekEntries = timeEntries.filter(e => weekDates.includes(e.date));

      const thisMonthHours = thisMonthEntries.reduce((s,e) => s+e.hours, 0);
      const lastMonthHours = lastMonthEntries.reduce((s,e) => s+e.hours, 0);
      const weekHours = weekEntries.reduce((s,e) => s+e.hours, 0);

      // Hours by project
      const hoursByProject = useMemo(() => {
        const h = {};
        thisMonthEntries.forEach(e => { h[e.projectName] = (h[e.projectName]||0) + e.hours; });
        return Object.entries(h).sort((a,b) => b[1]-a[1]);
      }, [thisMonthEntries]);

      const maxProjectHours = Math.max(...hoursByProject.map(([,h]) => h), 1);

      // Hours by day of week
      const hoursByDow = useMemo(() => {
        const h = [0,0,0,0,0,0,0];
        timeEntries.forEach(e => {
          const d = parseDate(e.date).getDay();
          const idx = d === 0 ? 6 : d - 1;
          h[idx] += e.hours;
        });
        return h;
      }, [timeEntries]);
      const maxDow = Math.max(...hoursByDow, 1);

      // Top cost codes
      const topCostCodes = useMemo(() => {
        const h = {};
        thisMonthEntries.forEach(e => { h[e.costCode] = (h[e.costCode]||0) + e.hours; });
        return Object.entries(h).sort((a,b) => b[1]-a[1]).slice(0,5);
      }, [thisMonthEntries]);

      const overtime = Math.max(0, weekHours - TARGET_HOURS);
      const utilization = Math.round((weekHours / TARGET_HOURS) * 100);

      const colors = ['bg-cyan-400','bg-emerald-400','bg-amber-400','bg-violet-400','bg-rose-400','bg-blue-400'];

      return (
        <div className="space-y-6">
          {/* Summary cards */}
          <div className="grid grid-cols-2 gap-3">
            <div className="p-3 rounded-xl bg-white/5">
              <div className="text-xs text-white/50">This Month</div>
              <div className="text-xl font-bold font-mono text-cyan-300">{thisMonthHours.toFixed(1)}h</div>
            </div>
            <div className="p-3 rounded-xl bg-white/5">
              <div className="text-xs text-white/50">Last Month</div>
              <div className="text-xl font-bold font-mono text-white/60">{lastMonthHours.toFixed(1)}h</div>
            </div>
            <div className="p-3 rounded-xl bg-white/5">
              <div className="text-xs text-white/50">Utilization</div>
              <div className={`text-xl font-bold font-mono ${utilization >= 100 ? 'text-emerald-400' : 'text-amber-400'}`}>{utilization}%</div>
            </div>
            <div className="p-3 rounded-xl bg-white/5">
              <div className="text-xs text-white/50">Overtime</div>
              <div className={`text-xl font-bold font-mono ${overtime > 0 ? 'text-rose-400' : 'text-white/30'}`}>{overtime.toFixed(1)}h</div>
            </div>
          </div>

          {/* Hours by project bar chart */}
          <div>
            <h3 className="text-xs text-white/50 uppercase tracking-wider mb-3">Hours by Project (This Month)</h3>
            <div className="space-y-2">
              {hoursByProject.map(([name, hrs], i) => (
                <div key={name} className="flex items-center gap-3">
                  <div className="w-24 text-xs text-white/60 truncate">{name}</div>
                  <div className="flex-1 h-5 bg-white/5 rounded-full overflow-hidden">
                    <div className={`h-full rounded-full ${colors[i%colors.length]} bar-chart-bar`}
                      style={{width: `${(hrs/maxProjectHours)*100}%`, opacity: 0.8}} />
                  </div>
                  <div className="text-xs font-mono text-white/60 w-10 text-right">{hrs.toFixed(1)}</div>
                </div>
              ))}
              {hoursByProject.length === 0 && <div className="text-white/30 text-sm text-center py-4">No data this month</div>}
            </div>
          </div>

          {/* Day of week trend */}
          <div>
            <h3 className="text-xs text-white/50 uppercase tracking-wider mb-3">Hours by Day of Week</h3>
            <div className="flex items-end gap-2 h-20">
              {hoursByDow.map((h, i) => (
                <div key={i} className="flex-1 flex flex-col items-center gap-1">
                  <div className="text-[10px] font-mono text-white/40">{h.toFixed(0)}</div>
                  <div className="w-full bg-white/5 rounded-t relative" style={{height: `${Math.max(4, (h/maxDow)*60)}px`}}>
                    <div className="absolute inset-0 bg-cyan-400/60 rounded-t bar-chart-bar" style={{height: '100%'}} />
                  </div>
                  <div className="text-[10px] text-white/40">{DAYS[i]}</div>
                </div>
              ))}
            </div>
          </div>

          {/* Top cost codes */}
          <div>
            <h3 className="text-xs text-white/50 uppercase tracking-wider mb-3">Top Cost Codes</h3>
            <div className="space-y-1">
              {topCostCodes.map(([code, hrs], i) => (
                <div key={code} className="flex justify-between text-sm">
                  <span className="font-mono text-white/60">{code}</span>
                  <span className="font-mono text-emerald-400">{hrs.toFixed(1)}h</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    };

    // ============================================
    // CALENDAR VIEW
    // ============================================
    const CalendarView = () => {
      const { timeEntries } = useData();
      const [year, setYear] = useState(new Date().getFullYear());
      const [month, setMonth] = useState(new Date().getMonth());
      const [selectedDay, setSelectedDay] = useState(null);

      const dates = useMemo(() => getMonthDates(year, month), [year, month]);
      const firstDow = (new Date(year, month, 1).getDay() + 6) % 7; // Mon=0

      const hoursByDate = useMemo(() => {
        const h = {};
        timeEntries.forEach(e => { h[e.date] = (h[e.date]||0) + e.hours; });
        return h;
      }, [timeEntries]);

      const getHeat = (hrs) => {
        if (!hrs) return 'heat-0';
        if (hrs < 2) return 'heat-1';
        if (hrs < 4) return 'heat-2';
        if (hrs < 6) return 'heat-3';
        if (hrs < 8) return 'heat-4';
        return 'heat-5';
      };

      const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
      const todayStr = today();

      const dayEntries = selectedDay ? timeEntries.filter(e => e.date === selectedDay) : [];

      const prevMonth = () => { if (month === 0) { setMonth(11); setYear(y=>y-1); } else setMonth(m=>m-1); setSelectedDay(null); };
      const nextMonth = () => { if (month === 11) { setMonth(0); setYear(y=>y+1); } else setMonth(m=>m+1); setSelectedDay(null); };

      return (
        <div className="space-y-4">
          <div className="flex items-center justify-between">
            <button onClick={prevMonth} className="w-8 h-8 rounded-lg bg-white/5 hover:bg-white/10 flex items-center justify-center">←</button>
            <div className="font-semibold">{monthNames[month]} {year}</div>
            <button onClick={nextMonth} className="w-8 h-8 rounded-lg bg-white/5 hover:bg-white/10 flex items-center justify-center">→</button>
          </div>

          <div className="grid grid-cols-7 gap-1">
            {DAYS.map(d => <div key={d} className="text-center text-xs text-white/40 py-1">{d}</div>)}
            {Array.from({length: firstDow}).map((_,i) => <div key={`empty-${i}`} />)}
            {dates.map(date => {
              const hrs = hoursByDate[date] || 0;
              const dayNum = parseInt(date.split('-')[2]);
              return (
                <button key={date} onClick={() => setSelectedDay(date === selectedDay ? null : date)}
                  className={`aspect-square rounded-lg flex flex-col items-center justify-center text-xs transition-all ${getHeat(hrs)} ${date === todayStr ? 'ring-1 ring-cyan-400/50' : ''} ${date === selectedDay ? 'ring-2 ring-white/50' : ''} hover:ring-1 hover:ring-white/30`}>
                  <span className={`${date === todayStr ? 'text-cyan-400 font-bold' : 'text-white/70'}`}>{dayNum}</span>
                  {hrs > 0 && <span className="text-[9px] font-mono text-white/50">{hrs}</span>}
                </button>
              );
            })}
          </div>

          {selectedDay && (
            <div className="slide-up">
              <h3 className="text-xs text-white/50 uppercase tracking-wider mb-2">{selectedDay} — {(hoursByDate[selectedDay]||0).toFixed(1)}h</h3>
              <div className="space-y-1 max-h-40 overflow-y-auto">
                {dayEntries.map(e => (
                  <div key={e.id} className="flex justify-between p-2 rounded-lg bg-white/5 text-sm">
                    <span className="truncate">{e.projectName} · {e.costCode}</span>
                    <span className="font-mono text-emerald-400 ml-2">{e.hours}h</span>
                  </div>
                ))}
                {dayEntries.length === 0 && <div className="text-white/30 text-sm text-center py-3">No entries</div>}
              </div>
            </div>
          )}
        </div>
      );
    };

    // ============================================
    // TEMPLATES
    // ============================================
    const TemplatesPanel = () => {
      const { templates, addTemplate, deleteTemplate, projects, addTimeEntry } = useData();
      const toast = useToast();
      const [isAdding, setIsAdding] = useState(false);
      const [tpl, setTpl] = useState({ name: '', projectId: '', costCode: '', hours: '', description: '', tags: [] });

      const project = projects.find(p => p.id === tpl.projectId);

      const handleSave = () => {
        if (!tpl.name || !tpl.projectId || !tpl.costCode || !tpl.hours) return;
        addTemplate({ ...tpl, projectName: project?.name, projectNumber: project?.number });
        setTpl({ name: '', projectId: '', costCode: '', hours: '', description: '', tags: [] });
        setIsAdding(false);
        toast('Template saved');
      };

      const useTemplate = (t) => {
        addTimeEntry({
          projectId: t.projectId, projectName: t.projectName, projectNumber: t.projectNumber,
          costCode: t.costCode, hours: parseFloat(t.hours), date: today(), description: t.description || '', tags: t.tags || []
        });
        toast(`Logged ${t.hours}h from template "${t.name}"`);
      };

      return (
        <div className="space-y-4">
          <div className="space-y-2">
            {templates.map(t => (
              <div key={t.id} className="flex items-center gap-2 p-3 rounded-xl bg-white/5 group hover:bg-white/8 transition-colors">
                <div className="flex-1">
                  <div className="text-sm font-medium">{t.name}</div>
                  <div className="text-xs text-white/50">{t.projectName} · {t.costCode} · {t.hours}h</div>
                </div>
                <button onClick={() => useTemplate(t)} className="px-3 py-1.5 rounded-lg bg-emerald-500/20 text-emerald-400 text-xs hover:bg-emerald-500/30 transition-colors">Use</button>
                <button onClick={() => deleteTemplate(t.id)} className="opacity-0 group-hover:opacity-100 w-6 h-6 rounded bg-red-500/20 flex items-center justify-center transition-opacity">
                  <svg className="w-3 h-3 text-red-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" /></svg>
                </button>
              </div>
            ))}
            {templates.length === 0 && !isAdding && <div className="text-center text-white/30 py-6"><div className="text-2xl mb-2">📋</div><p className="text-sm">Save common entries as templates</p></div>}
          </div>

          {isAdding ? (
            <div className="space-y-3 p-4 rounded-xl border border-cyan-500/30 bg-cyan-500/5 slide-up">
              <input type="text" value={tpl.name} onChange={e => setTpl({...tpl, name: e.target.value})} placeholder="Template name" className="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-2.5 text-sm" />
              <select value={tpl.projectId} onChange={e => setTpl({...tpl, projectId: e.target.value, costCode: ''})} className="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-2.5 text-sm">
                <option value="">Select project...</option>
                {projects.map(p => <option key={p.id} value={p.id}>{p.number} - {p.name}</option>)}
              </select>
              {project && (
                <select value={tpl.costCode} onChange={e => setTpl({...tpl, costCode: e.target.value})} className="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-2.5 text-sm">
                  <option value="">Select cost code...</option>
                  {project.costCodes.map(c => <option key={c} value={c}>{c}</option>)}
                </select>
              )}
              <input type="number" value={tpl.hours} onChange={e => setTpl({...tpl, hours: e.target.value})} placeholder="Hours" step="0.25"
                className="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-2.5 font-mono text-sm" />
              <input type="text" value={tpl.description} onChange={e => setTpl({...tpl, description: e.target.value})} placeholder="Description (optional)"
                className="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-2.5 text-sm" />
              <div className="flex gap-2">
                <button onClick={handleSave} className="flex-1 py-2.5 rounded-xl bg-cyan-500 text-white font-medium">Save Template</button>
                <button onClick={() => setIsAdding(false)} className="px-4 py-2.5 rounded-xl bg-white/10">Cancel</button>
              </div>
            </div>
          ) : (
            <button onClick={() => setIsAdding(true)} className="w-full py-3 rounded-xl border-2 border-dashed border-white/20 text-white/50 hover:border-cyan-500/50 hover:text-cyan-400 transition-colors">+ New Template</button>
          )}
        </div>
      );
    };

    // ============================================
    // SEARCH & FILTER
    // ============================================
    const SearchPanel = () => {
      const { timeEntries, projects, deleteTimeEntry, bulkDeleteEntries } = useData();
      const { pushUndo } = useUndo();
      const toast = useToast();
      const [query, setQuery] = useState('');
      const [projectFilter, setProjectFilter] = useState('');
      const [tagFilter, setTagFilter] = useState('');
      const [dateFrom, setDateFrom] = useState('');
      const [dateTo, setDateTo] = useState('');
      const [selectedIds, setSelectedIds] = useState(new Set());

      const filtered = useMemo(() => {
        return timeEntries.filter(e => {
          if (query && !`${e.projectName} ${e.costCode} ${e.description||''} ${(e.tags||[]).join(' ')}`.toLowerCase().includes(query.toLowerCase())) return false;
          if (projectFilter && e.projectId !== projectFilter) return false;
          if (tagFilter && !(e.tags||[]).includes(tagFilter)) return false;
          if (dateFrom && e.date < dateFrom) return false;
          if (dateTo && e.date > dateTo) return false;
          return true;
        }).reverse();
      }, [timeEntries, query, projectFilter, tagFilter, dateFrom, dateTo]);

      const totalHours = filtered.reduce((s,e) => s+e.hours, 0);

      const allTags = useMemo(() => {
        const tags = new Set();
        timeEntries.forEach(e => (e.tags||[]).forEach(t => tags.add(t)));
        return [...tags];
      }, [timeEntries]);

      const bulkDelete = () => {
        if (selectedIds.size === 0) return;
        const deleted = bulkDeleteEntries([...selectedIds]);
        pushUndo({ type: 'bulkDelete', entries: deleted });
        setSelectedIds(new Set());
        toast(`Deleted ${deleted.length} entries`);
      };

      return (
        <div className="space-y-4">
          <input type="text" value={query} onChange={e => setQuery(e.target.value)} placeholder="🔍 Search entries..."
            className="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3" />

          <div className="grid grid-cols-2 gap-2">
            <select value={projectFilter} onChange={e => setProjectFilter(e.target.value)} className="bg-white/5 border border-white/10 rounded-xl px-3 py-2 text-sm">
              <option value="">All Projects</option>
              {projects.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
            </select>
            <select value={tagFilter} onChange={e => setTagFilter(e.target.value)} className="bg-white/5 border border-white/10 rounded-xl px-3 py-2 text-sm">
              <option value="">All Tags</option>
              {allTags.map(t => <option key={t} value={t}>{t}</option>)}
            </select>
            <input type="date" value={dateFrom} onChange={e => setDateFrom(e.target.value)} className="bg-white/5 border border-white/10 rounded-xl px-3 py-2 text-sm" />
            <input type="date" value={dateTo} onChange={e => setDateTo(e.target.value)} className="bg-white/5 border border-white/10 rounded-xl px-3 py-2 text-sm" />
          </div>

          <div className="flex justify-between items-center">
            <span className="text-xs text-white/50">{filtered.length} entries · {totalHours.toFixed(1)}h</span>
            {selectedIds.size > 0 && (
              <button onClick={bulkDelete} className="text-xs px-3 py-1 rounded-lg bg-red-500/20 text-red-400 hover:bg-red-500/30">Delete {selectedIds.size} selected</button>
            )}
          </div>

          <div className="space-y-1.5 max-h-72 overflow-y-auto">
            {filtered.slice(0, 50).map(e => (
              <div key={e.id} className="flex items-center gap-2 p-2.5 rounded-xl bg-white/5 group text-sm">
                <input type="checkbox" checked={selectedIds.has(e.id)} onChange={() => {
                  setSelectedIds(prev => { const n = new Set(prev); n.has(e.id) ? n.delete(e.id) : n.add(e.id); return n; });
                }} className="w-3.5 h-3.5" />
                <div className="flex-1 min-w-0">
                  <div className="font-medium truncate">{e.projectName}</div>
                  <div className="text-xs text-white/40">{e.date} · {e.costCode} {e.description ? `· ${e.description}` : ''}</div>
                </div>
                <span className="font-mono text-emerald-400">{e.hours}h</span>
              </div>
            ))}
            {filtered.length === 0 && <div className="text-center text-white/30 py-6">No matches</div>}
          </div>
        </div>
      );
    };

    // ============================================
    // EXPORT PANEL
    // ============================================
    const ExportPanel = () => {
      const { timeEntries, projects, weekDates, weeklyHours, user } = useData();
      const toast = useToast();

      const weekEntries = timeEntries.filter(e => weekDates.includes(e.date));

      const exportCSV = () => {
        const rows = [['Date','Project','Project Number','Cost Code','Hours','Description','Tags']];
        timeEntries.forEach(e => rows.push([e.date, e.projectName, e.projectNumber||'', e.costCode, e.hours, e.description||'', (e.tags||[]).join(';')]));
        const csv = rows.map(r => r.map(c => `"${c}"`).join(',')).join('\n');
        const blob = new Blob([csv], {type:'text/csv'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = `timetracker-export-${today()}.csv`; a.click();
        URL.revokeObjectURL(url);
        toast('CSV exported');
      };

      const generateWeeklyReport = () => {
        const grouped = {};
        weekEntries.forEach(e => {
          if (!grouped[e.projectName]) grouped[e.projectName] = [];
          grouped[e.projectName].push(e);
        });
        let report = `WEEKLY TIMESHEET REPORT\n`;
        report += `Employee: ${user?.name || 'N/A'}\n`;
        report += `Week: ${weekDates[0]} to ${weekDates[6]}\n`;
        report += `Total Hours: ${weeklyHours.toFixed(1)}h\n`;
        report += `${'='.repeat(50)}\n\n`;

        Object.entries(grouped).forEach(([proj, entries]) => {
          const total = entries.reduce((s,e) => s+e.hours, 0);
          report += `${proj} — ${total.toFixed(1)}h\n`;
          report += `${'-'.repeat(40)}\n`;
          entries.forEach(e => {
            report += `  ${e.date}  ${e.costCode.padEnd(20)} ${e.hours}h  ${e.description||''}\n`;
          });
          report += '\n';
        });
        return report;
      };

      const copyReport = () => {
        navigator.clipboard.writeText(generateWeeklyReport());
        toast('Report copied to clipboard');
      };

      const exportTable = () => {
        let html = '<table border="1" cellpadding="4" cellspacing="0"><tr><th>Date</th><th>Project</th><th>Cost Code</th><th>Hours</th><th>Description</th></tr>';
        weekEntries.forEach(e => {
          html += `<tr><td>${e.date}</td><td>${e.projectName}</td><td>${e.costCode}</td><td>${e.hours}</td><td>${e.description||''}</td></tr>`;
        });
        html += `<tr><td colspan="3"><strong>Total</strong></td><td><strong>${weeklyHours.toFixed(1)}</strong></td><td></td></tr></table>`;
        const blob = new Blob([html], {type:'text/html'});
        navigator.clipboard.write([new ClipboardItem({'text/html': blob})]).then(() => toast('Table copied — paste into Excel'));
      };

      return (
        <div className="space-y-4">
          <div className="space-y-2">
            <button onClick={exportCSV} className="w-full py-3 rounded-xl bg-white/5 hover:bg-white/10 transition-colors text-left px-4 flex items-center gap-3">
              <span>📄</span><div><div className="text-sm font-medium">Export All to CSV</div><div className="text-xs text-white/50">All time entries as spreadsheet</div></div>
            </button>
            <button onClick={exportTable} className="w-full py-3 rounded-xl bg-white/5 hover:bg-white/10 transition-colors text-left px-4 flex items-center gap-3">
              <span>📊</span><div><div className="text-sm font-medium">Copy Weekly Table</div><div className="text-xs text-white/50">Paste directly into Excel</div></div>
            </button>
            <button onClick={copyReport} className="w-full py-3 rounded-xl bg-white/5 hover:bg-white/10 transition-colors text-left px-4 flex items-center gap-3">
              <span>📧</span><div><div className="text-sm font-medium">Copy Email Report</div><div className="text-xs text-white/50">Formatted text for email</div></div>
            </button>
            <button onClick={() => window.print()} className="w-full py-3 rounded-xl bg-white/5 hover:bg-white/10 transition-colors text-left px-4 flex items-center gap-3">
              <span>🖨️</span><div><div className="text-sm font-medium">Print Report</div><div className="text-xs text-white/50">Print-friendly weekly view</div></div>
            </button>
          </div>

          {/* Preview */}
          <div className="p-4 rounded-xl bg-white/5 max-h-60 overflow-y-auto">
            <pre className="text-xs text-white/60 font-mono whitespace-pre-wrap">{generateWeeklyReport()}</pre>
          </div>
        </div>
      );
    };

    // ============================================
    // THEME SWITCHER
    // ============================================
    const ThemeSwitcher = () => {
      const { theme, setTheme } = useTheme();
      return (
        <div className="space-y-3">
          {Object.entries(THEMES).map(([key, t]) => (
            <button key={key} onClick={() => setTheme(key)}
              className={`w-full p-4 rounded-xl text-left transition-all ${theme === key ? 'bg-white/10 border border-cyan-500/50' : 'bg-white/5 border border-transparent hover:bg-white/10'}`}>
              <div className="font-medium">{t.name}</div>
              <div className="text-xs text-white/50 mt-1">{key === 'dark' ? 'Default dark with purple tones' : key === 'midnight' ? 'Deep blue night' : key === 'forest' ? 'Nature-inspired greens' : 'Warm golden hues'}</div>
            </button>
          ))}
        </div>
      );
    };

    // ============================================
    // KEYBOARD SHORTCUTS MODAL
    // ============================================
    const ShortcutsModal = ({ onClose }) => (
      <div className="fixed inset-0 z-[9999] flex items-center justify-center bg-black/50 backdrop-blur-sm fade-in" onClick={onClose}>
        <div className="glass rounded-2xl p-6 w-full max-w-md glow-cyan panel-enter" onClick={e => e.stopPropagation()}>
          <div className="flex justify-between items-center mb-4">
            <h2 className="font-semibold text-lg">⌨️ Keyboard Shortcuts</h2>
            <button onClick={onClose} className="w-8 h-8 rounded-lg bg-white/5 hover:bg-white/10 flex items-center justify-center">✕</button>
          </div>
          <div className="space-y-3">
            {[
              ['Ctrl + N', 'New time entry'],
              ['Ctrl + T', 'Toggle timer'],
              ['Ctrl + 1', 'Toggle Quick Entry'],
              ['Ctrl + 2', 'Toggle Timesheet'],
              ['Ctrl + 3', 'Toggle Projects'],
              ['Ctrl + 4', 'Toggle Notes'],
              ['Ctrl + 5', 'Toggle Analytics'],
              ['Ctrl + 6', 'Toggle Calendar'],
              ['Ctrl + Z', 'Undo last action'],
              ['Escape', 'Close active panel'],
              ['?', 'Show this help'],
            ].map(([key, desc]) => (
              <div key={key} className="flex justify-between items-center">
                <span className="text-sm text-white/70">{desc}</span>
                <span className="kbd">{key}</span>
              </div>
            ))}
          </div>
        </div>
      </div>
    );

    // ============================================
    // REMINDER SYSTEM
    // ============================================
    const useReminders = (timeEntries) => {
      useEffect(() => {
        if (!('Notification' in window)) return;
        const todayEntries = timeEntries.filter(e => e.date === today());
        if (todayEntries.length === 0) {
          const lastReminder = localStorage.getItem('jtt_last_reminder');
          const todayStr = today();
          if (lastReminder === todayStr) return;
          const hour = new Date().getHours();
          if (hour >= 16) {
            Notification.requestPermission().then(perm => {
              if (perm === 'granted') {
                new Notification('TimeTracker Reminder', { body: "You haven't logged any time today!", icon: '⏰' });
                localStorage.setItem('jtt_last_reminder', todayStr);
              }
            });
          }
        }
      }, [timeEntries]);
    };

    // ============================================
    // SETUP SCREEN
    // ============================================
    const SetupScreen = ({ onComplete }) => {
      const [step, setStep] = useState(1);
      const [token, setToken] = useState('');
      const [name, setName] = useState('');
      const [employeeId, setEmployeeId] = useState('');
      const [password, setPassword] = useState('');
      const [confirmPassword, setConfirmPassword] = useState('');
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');
      const [user, setUser] = useState(null);

      const handleValidateToken = async () => {
        setLoading(true); setError('');
        const userData = await GistStorage.validateToken(token);
        if (userData) { setUser(userData); setName(userData.name || userData.login); setStep(2); }
        else setError('Invalid token. Needs "gist" scope.');
        setLoading(false);
      };

      const handleComplete = async () => {
        if (password.length < 4) { setError('Password must be at least 4 characters.'); return; }
        if (password !== confirmPassword) { setError('Passwords do not match.'); return; }
        setLoading(true); setError('');
        let gistId = localStorage.getItem('jtt_gist_id');
        if (!gistId) { gistId = await GistStorage.createGist(token); if (!gistId) { setError('Failed to create storage.'); setLoading(false); return; } }
        const passwordHash = await hashPassword(password);
        localStorage.setItem('jtt_storage', JSON.stringify({ token, gistId }));
        localStorage.setItem('jtt_credentials', JSON.stringify({ name, employeeId, login: user.login, avatar: user.avatar_url, passwordHash }));
        localStorage.setItem('jtt_session', 'active');
        onComplete({ token, gistId, user: { name, employeeId, login: user.login, avatar: user.avatar_url } });
      };

      return (
        <div className="min-h-screen flex items-center justify-center p-4">
          <div className="glass rounded-3xl p-8 w-full max-w-md glow-cyan panel-enter">
            <div className="text-center mb-8">
              <div className="w-20 h-20 mx-auto mb-4 rounded-2xl bg-gradient-to-br from-cyan-500 to-emerald-500 flex items-center justify-center">
                <svg className="w-10 h-10 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
              </div>
              <h1 className="text-3xl font-bold bg-gradient-to-r from-cyan-400 to-emerald-400 bg-clip-text text-transparent">TimeTracker</h1>
              <p className="text-white/50 mt-2">Jacobs Engineering</p>
            </div>

            <div className="flex justify-center gap-2 mb-6">
              {[1,2,3].map(s => <div key={s} className={`h-1.5 rounded-full transition-all ${s === step ? 'w-8 bg-cyan-400' : s < step ? 'w-8 bg-emerald-500' : 'w-8 bg-white/10'}`} />)}
            </div>

            {step === 1 && (
              <div className="space-y-4 slide-up">
                <div className="p-4 rounded-xl bg-white/5 border border-white/10">
                  <p className="text-white/70 text-sm mb-3"><strong className="text-white">Step 1:</strong> Connect to GitHub for cloud storage.</p>
                  <ol className="text-xs text-white/50 space-y-1 list-decimal list-inside">
                    <li>Go to <a href="https://github.com/settings/tokens/new?scopes=gist&description=Jacobs%20TimeTracker" target="_blank" className="text-cyan-400 hover:underline">GitHub Token Settings</a></li>
                    <li>Generate token with gist scope</li>
                    <li>Paste below</li>
                  </ol>
                </div>
                <div>
                  <label className="block text-xs text-white/50 mb-2 uppercase tracking-wider">GitHub Token</label>
                  <input type="password" value={token} onChange={e => setToken(e.target.value)} onKeyDown={e => e.key === 'Enter' && handleValidateToken()}
                    placeholder="ghp_xxxxxxxxxxxx" className="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 font-mono text-sm" autoFocus />
                </div>
                {error && <div className="text-red-400 text-sm p-3 rounded-xl bg-red-500/10 border border-red-500/20">{error}</div>}
                <button onClick={handleValidateToken} disabled={!token || loading}
                  className="w-full py-4 rounded-xl bg-gradient-to-r from-cyan-500 to-emerald-500 text-white font-semibold disabled:opacity-50">
                  {loading ? 'Validating...' : 'Connect GitHub →'}
                </button>
              </div>
            )}

            {step === 2 && (
              <div className="space-y-4 slide-up">
                <div className="flex items-center gap-4 p-4 rounded-xl bg-emerald-500/10 border border-emerald-500/20">
                  <img src={user.avatar_url} className="w-12 h-12 rounded-full" />
                  <div><div className="text-emerald-400 text-sm">Connected as</div><div className="font-semibold">{user.login}</div></div>
                </div>
                <div>
                  <label className="block text-xs text-white/50 mb-2 uppercase tracking-wider">Your Name</label>
                  <input type="text" value={name} onChange={e => setName(e.target.value)} className="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3" />
                </div>
                <div>
                  <label className="block text-xs text-white/50 mb-2 uppercase tracking-wider">Employee ID (optional)</label>
                  <input type="text" value={employeeId} onChange={e => setEmployeeId(e.target.value)} placeholder="e.g., J12345" className="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 font-mono" />
                </div>
                <button onClick={() => { if(name) setStep(3); }} disabled={!name}
                  className="w-full py-4 rounded-xl bg-gradient-to-r from-cyan-500 to-emerald-500 text-white font-semibold disabled:opacity-50">Next →</button>
              </div>
            )}

            {step === 3 && (
              <div className="space-y-4 slide-up">
                <div className="p-4 rounded-xl bg-white/5 border border-white/10">
                  <p className="text-white/70 text-sm"><strong className="text-white">Step 3:</strong> Create a login password.</p>
                </div>
                <div>
                  <label className="block text-xs text-white/50 mb-2 uppercase tracking-wider">Password</label>
                  <input type="password" value={password} onChange={e => setPassword(e.target.value)} placeholder="At least 4 characters" className="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3" autoFocus />
                </div>
                <div>
                  <label className="block text-xs text-white/50 mb-2 uppercase tracking-wider">Confirm</label>
                  <input type="password" value={confirmPassword} onChange={e => setConfirmPassword(e.target.value)} onKeyDown={e => e.key === 'Enter' && handleComplete()}
                    className="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3" />
                </div>
                {error && <div className="text-red-400 text-sm p-3 rounded-xl bg-red-500/10 border border-red-500/20">{error}</div>}
                <button onClick={handleComplete} disabled={!password || !confirmPassword || loading}
                  className="w-full py-4 rounded-xl bg-gradient-to-r from-cyan-500 to-emerald-500 text-white font-semibold disabled:opacity-50">
                  {loading ? 'Setting up...' : 'Start Tracking →'}
                </button>
              </div>
            )}
          </div>
        </div>
      );
    };

    // ============================================
    // LOGIN SCREEN
    // ============================================
    const LoginScreen = ({ credentials, onLogin, onReset }) => {
      const [password, setPassword] = useState('');
      const [error, setError] = useState('');
      const [loading, setLoading] = useState(false);

      const handleLogin = async () => {
        setLoading(true); setError('');
        const hash = await hashPassword(password);
        if (hash === credentials.passwordHash) {
          localStorage.setItem('jtt_session', 'active');
          const storage = JSON.parse(localStorage.getItem('jtt_storage'));
          onLogin({ token: storage.token, gistId: storage.gistId, user: { name: credentials.name, employeeId: credentials.employeeId, login: credentials.login, avatar: credentials.avatar } });
        } else { setError('Incorrect password.'); }
        setLoading(false); setPassword('');
      };

      return (
        <div className="min-h-screen flex items-center justify-center p-4">
          <div className="glass rounded-3xl p-8 w-full max-w-md glow-cyan panel-enter">
            <div className="text-center mb-8">
              <div className="w-20 h-20 mx-auto mb-4 rounded-2xl bg-gradient-to-br from-cyan-500 to-emerald-500 flex items-center justify-center">
                <svg className="w-10 h-10 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
              </div>
              <h1 className="text-3xl font-bold bg-gradient-to-r from-cyan-400 to-emerald-400 bg-clip-text text-transparent">TimeTracker</h1>
              <p className="text-white/50 mt-2">Jacobs Engineering</p>
            </div>
            <div className="space-y-4">
              <div className="flex items-center gap-4 p-4 rounded-xl bg-white/5 border border-white/10">
                {credentials.avatar && <img src={credentials.avatar} className="w-12 h-12 rounded-full" />}
                <div><div className="text-white/50 text-sm">Welcome back</div><div className="font-semibold text-lg">{credentials.name}</div></div>
              </div>
              <input type="password" value={password} onChange={e => setPassword(e.target.value)} onKeyDown={e => e.key === 'Enter' && handleLogin()}
                placeholder="Enter password" className="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3" autoFocus />
              {error && <div className="text-red-400 text-sm p-3 rounded-xl bg-red-500/10 border border-red-500/20">{error}</div>}
              <button onClick={handleLogin} disabled={!password || loading}
                className="w-full py-4 rounded-xl bg-gradient-to-r from-cyan-500 to-emerald-500 text-white font-semibold disabled:opacity-50">
                {loading ? 'Logging in...' : 'Log In'}
              </button>
              <button onClick={onReset} className="w-full text-center text-white/30 text-xs hover:text-white/50 transition-colors">Reset account</button>
            </div>
          </div>
        </div>
      );
    };

    // ============================================
    // MAIN DASHBOARD
    // ============================================
    const Dashboard = () => {
      const { user, weeklyHours, timeEntries, addTimeEntry, deleteTimeEntry, setTimeEntries } = useData();
      const { popUndo, hasUndo } = useUndo();
      const toast = useToast();
      const [panels, setPanels] = useState({
        quickEntry: true, timesheet: true, projects: false, notes: false,
        timer: false, analytics: false, calendar: false, templates: false,
        search: false, export: false, themes: false,
      });
      const [showShortcuts, setShowShortcuts] = useState(false);

      useReminders(timeEntries);

      const togglePanel = useCallback((key) => setPanels(prev => ({ ...prev, [key]: !prev[key] })), []);

      // Keyboard shortcuts
      useEffect(() => {
        const handler = (e) => {
          if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') {
            if (e.key === 'Escape') e.target.blur();
            return;
          }
          if (e.key === '?') { e.preventDefault(); setShowShortcuts(s => !s); return; }
          if (e.key === 'Escape') { setShowShortcuts(false); return; }
          if (e.ctrlKey || e.metaKey) {
            const map = { 'n': 'quickEntry', 't': 'timer', '1': 'quickEntry', '2': 'timesheet', '3': 'projects', '4': 'notes', '5': 'analytics', '6': 'calendar' };
            if (map[e.key]) { e.preventDefault(); togglePanel(map[e.key]); return; }
            if (e.key === 'z') {
              e.preventDefault();
              const action = popUndo();
              if (!action) { toast('Nothing to undo', 'warning'); return; }
              if (action.type === 'deleteEntry') {
                setTimeEntries(prev => [...prev, action.entry]);
                toast('Entry restored');
              } else if (action.type === 'addEntry') {
                setTimeEntries(prev => prev.filter(e => e.id !== action.entry.id));
                toast('Entry removed');
              } else if (action.type === 'bulkDelete') {
                setTimeEntries(prev => [...prev, ...action.entries]);
                toast(`${action.entries.length} entries restored`);
              }
            }
          }
        };
        window.addEventListener('keydown', handler);
        return () => window.removeEventListener('keydown', handler);
      }, [togglePanel, popUndo, toast, setTimeEntries]);

      const handleLogout = () => { localStorage.removeItem('jtt_session'); window.location.reload(); };

      // Duplicate last entry
      const duplicateLast = () => {
        const last = timeEntries[timeEntries.length - 1];
        if (!last) { toast('No entry to duplicate', 'warning'); return; }
        addTimeEntry({ ...last, date: today(), id: undefined, createdAt: undefined });
        toast('Duplicated last entry');
      };

      const panelButtons = [
        { key: 'quickEntry', icon: '⚡', label: 'Entry', color: 'cyan' },
        { key: 'timer', icon: '⏱️', label: 'Timer', color: 'rose' },
        { key: 'timesheet', icon: '📊', label: 'Timesheet', color: 'emerald' },
        { key: 'analytics', icon: '📈', label: 'Analytics', color: 'blue' },
        { key: 'calendar', icon: '📅', label: 'Calendar', color: 'amber' },
        { key: 'projects', icon: '📁', label: 'Projects', color: 'amber' },
        { key: 'templates', icon: '📋', label: 'Templates', color: 'violet' },
        { key: 'notes', icon: '📝', label: 'Notes', color: 'violet' },
        { key: 'search', icon: '🔍', label: 'Search', color: 'cyan' },
        { key: 'export', icon: '📤', label: 'Export', color: 'emerald' },
        { key: 'themes', icon: '🎨', label: 'Themes', color: 'violet' },
      ];

      // Check if no time logged today
      const todayHours = timeEntries.filter(e => e.date === today()).reduce((s,e) => s+e.hours, 0);

      return (
        <div className="min-h-screen relative">
          <div className="orb w-96 h-96 bg-cyan-500 -top-48 -left-48" style={{ animationDelay: '0s' }} />
          <div className="orb w-80 h-80 bg-violet-500 top-1/2 -right-40" style={{ animationDelay: '-5s' }} />
          <div className="orb w-64 h-64 bg-emerald-500 -bottom-32 left-1/3" style={{ animationDelay: '-10s' }} />

          {/* Header */}
          <div className="fixed top-0 left-0 right-0 z-50 glass border-b border-white/5 no-print">
            <div className="max-w-full mx-auto px-4 py-3 flex items-center justify-between gap-2">
              <div className="flex items-center gap-3 flex-shrink-0">
                <div className="w-9 h-9 rounded-xl bg-gradient-to-br from-cyan-500 to-emerald-500 flex items-center justify-center">
                  <svg className="w-5 h-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                </div>
                <div className="hidden sm:block">
                  <h1 className="font-semibold text-sm">TimeTracker</h1>
                  <p className="text-[10px] text-white/50">Jacobs Engineering</p>
                </div>
              </div>

              {/* Panel buttons - scrollable on mobile */}
              <div className="flex items-center gap-1 overflow-x-auto flex-1 justify-center px-2">
                {panelButtons.map(btn => (
                  <button key={btn.key} onClick={() => togglePanel(btn.key)}
                    className={`px-2.5 py-1.5 rounded-lg text-xs transition-all flex items-center gap-1.5 flex-shrink-0 ${panels[btn.key] ? 'bg-white/10 text-white border border-white/20' : 'bg-white/5 text-white/60 hover:bg-white/10 border border-transparent'}`}>
                    <span>{btn.icon}</span>
                    <span className="hidden lg:inline">{btn.label}</span>
                  </button>
                ))}
                <button onClick={duplicateLast} className="px-2.5 py-1.5 rounded-lg text-xs bg-white/5 text-white/60 hover:bg-white/10 flex-shrink-0" title="Duplicate last entry">
                  📑
                </button>
                <button onClick={() => setShowShortcuts(true)} className="px-2.5 py-1.5 rounded-lg text-xs bg-white/5 text-white/60 hover:bg-white/10 flex-shrink-0" title="Shortcuts (?)">
                  ⌨️
                </button>
              </div>

              <div className="flex items-center gap-3 flex-shrink-0">
                <SyncIndicator />
                {todayHours === 0 && <div className="hidden sm:block text-xs text-amber-400 bg-amber-500/10 px-2 py-1 rounded-lg">No time today</div>}
                <div className="hidden sm:block text-right">
                  <div className="text-xs text-white/50">This Week</div>
                  <div className="font-mono font-bold text-emerald-400 text-sm">{weeklyHours.toFixed(1)}h</div>
                </div>
                {user?.avatar && <img src={user.avatar} className="w-7 h-7 rounded-lg hidden sm:block" />}
                <button onClick={handleLogout} className="w-7 h-7 rounded-lg bg-white/5 hover:bg-red-500/20 flex items-center justify-center" title="Sign Out">
                  <svg className="w-3.5 h-3.5 text-white/50" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" /></svg>
                </button>
              </div>
            </div>
          </div>

          {/* Panels */}
          {panels.quickEntry && <FloatingPanel title="Quick Entry" icon="⚡" defaultPosition={{x:40,y:80}} glowColor="cyan" width={380} zIndex={20} onClose={() => togglePanel('quickEntry')}><QuickEntry /></FloatingPanel>}
          {panels.timer && <FloatingPanel title="Live Timer" icon="⏱️" defaultPosition={{x:40,y:80}} glowColor="rose" width={360} zIndex={25} onClose={() => togglePanel('timer')}><LiveTimer /></FloatingPanel>}
          {panels.timesheet && <FloatingPanel title="Weekly Timesheet" icon="📊" defaultPosition={{x:460,y:80}} glowColor="emerald" width={440} zIndex={19} onClose={() => togglePanel('timesheet')}><WeeklyTimesheet /></FloatingPanel>}
          {panels.analytics && <FloatingPanel title="Analytics" icon="📈" defaultPosition={{x:460,y:80}} glowColor="blue" width={420} zIndex={18} onClose={() => togglePanel('analytics')}><AnalyticsDashboard /></FloatingPanel>}
          {panels.calendar && <FloatingPanel title="Calendar" icon="📅" defaultPosition={{x:920,y:80}} glowColor="amber" width={380} zIndex={17} onClose={() => togglePanel('calendar')}><CalendarView /></FloatingPanel>}
          {panels.projects && <FloatingPanel title="Projects" icon="📁" defaultPosition={{x:920,y:80}} glowColor="amber" width={400} zIndex={16} onClose={() => togglePanel('projects')}><ProjectsManager /></FloatingPanel>}
          {panels.templates && <FloatingPanel title="Templates" icon="📋" defaultPosition={{x:200,y:400}} glowColor="violet" width={380} zIndex={15} onClose={() => togglePanel('templates')}><TemplatesPanel /></FloatingPanel>}
          {panels.notes && <FloatingPanel title="Notes" icon="📝" defaultPosition={{x:200,y:400}} glowColor="violet" width={360} zIndex={14} onClose={() => togglePanel('notes')}><NotesPanel /></FloatingPanel>}
          {panels.search && <FloatingPanel title="Search & Filter" icon="🔍" defaultPosition={{x:300,y:120}} glowColor="cyan" width={440} zIndex={22} onClose={() => togglePanel('search')}><SearchPanel /></FloatingPanel>}
          {panels.export && <FloatingPanel title="Export" icon="📤" defaultPosition={{x:600,y:200}} glowColor="emerald" width={420} zIndex={21} onClose={() => togglePanel('export')}><ExportPanel /></FloatingPanel>}
          {panels.themes && <FloatingPanel title="Themes" icon="🎨" defaultPosition={{x:500,y:300}} glowColor="violet" width={340} zIndex={13} onClose={() => togglePanel('themes')}><ThemeSwitcher /></FloatingPanel>}

          {showShortcuts && <ShortcutsModal onClose={() => setShowShortcuts(false)} />}

          {!Object.values(panels).some(Boolean) && (
            <div className="fixed inset-0 flex items-center justify-center pointer-events-none" style={{paddingTop:'80px'}}>
              <div className="text-center text-white/30">
                <div className="text-6xl mb-4">🪟</div>
                <p>Click the buttons above to open panels</p>
                <p className="text-xs text-white/20 mt-2">Press ? for keyboard shortcuts</p>
              </div>
            </div>
          )}
        </div>
      );
    };

    // ============================================
    // APP ROOT
    // ============================================
    const App = () => {
      const [authInfo, setAuthInfo] = useState(null);
      const [credentials, setCredentials] = useState(() => {
        const saved = localStorage.getItem('jtt_credentials');
        return saved ? JSON.parse(saved) : null;
      });

      useEffect(() => {
        const session = localStorage.getItem('jtt_session');
        if (session === 'active' && credentials) {
          const storage = JSON.parse(localStorage.getItem('jtt_storage'));
          if (storage) {
            setAuthInfo({ token: storage.token, gistId: storage.gistId, user: { name: credentials.name, employeeId: credentials.employeeId, login: credentials.login, avatar: credentials.avatar } });
          }
        }
      }, []);

      const handleReset = () => {
        ['jtt_storage','jtt_credentials','jtt_session','jtt_auth','jtt_gist_id','jtt_timer','jtt_theme'].forEach(k => localStorage.removeItem(k));
        setAuthInfo(null); setCredentials(null);
      };

      if (!credentials) return (
        <ThemeProvider><ToastProvider>
          <SetupScreen onComplete={(info) => { setAuthInfo(info); setCredentials(JSON.parse(localStorage.getItem('jtt_credentials'))); }} />
        </ToastProvider></ThemeProvider>
      );

      if (!authInfo) return (
        <ThemeProvider><ToastProvider>
          <LoginScreen credentials={credentials} onLogin={setAuthInfo} onReset={handleReset} />
        </ToastProvider></ThemeProvider>
      );

      return (
        <ThemeProvider>
          <ToastProvider>
            <UndoProvider>
              <DataProvider authInfo={authInfo}>
                <Dashboard />
              </DataProvider>
            </UndoProvider>
          </ToastProvider>
        </ThemeProvider>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
